[package]
name = "xchacha20-blake3-siv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# There is no libFuzzer option key in this manifest: cargo-fuzz 0.13 has no
# `[fuzz]`/`max_len` table (checked against its source), so `-max_len=8192` and the
# other libFuzzer flags are passed on the command line -- the CI fuzz runs in
# `.github/workflows/deep.yml` do exactly that. The target's header records what the
# default 4096 cap leaves unreachable.

[dependencies.xchacha20-blake3-siv]
path = ".."

# `fuzz` is deliberately outside the parent workspace, so the parent's
# `[patch.crates-io]` does not reach this build. Without this duplicate patch, the
# fuzz targets link crates.io BLAKE3 1.8.7 and exercise none of the vendored fork's
# fixes (D-01 tail over-read, D-02 short `xof_many` write). Keep the two patches in
# step; `cargo tree --manifest-path fuzz/Cargo.toml -i blake3` must show the path
# package, not the registry source.
[patch.crates-io]
blake3 = { path = "../blake3" }

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
