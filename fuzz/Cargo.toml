[package]
name = "xchacha20-blake3-siv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# There is no libFuzzer option key in this manifest: cargo-fuzz 0.13 has no
# `[fuzz]`/`max_len` table (checked against its source), so `-max_len=8192` and the
# other libFuzzer flags are passed on the command line -- the CI fuzz runs in
# `.github/workflows/deep.yml` do exactly that. The target's header records what the
# default 4096 cap leaves unreachable.

[dependencies.xchacha20-blake3-siv]
path = ".."

# The parent uses the maintained BLAKE3 fork under `../blake3` as a direct path
# dependency. No `[patch]` is needed here: that dependency resolves from the
# parent's manifest, so the fuzz targets exercise the same fork the library does.
# `cargo tree --manifest-path fuzz/Cargo.toml -i blake3` must show the path package.

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
