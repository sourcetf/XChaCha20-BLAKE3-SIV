# Automated update path for everything this repository pins.
#
# Pinning is a deliberate choice here (see the header of ci.yml): a `uses: foo@v7` is a
# *mutable* reference, and a repointed tag runs arbitrary code in this repository's CI — with
# `contents: write` in the release job, where it could tamper with the published `.crate`
# artifact. Pinning to a commit SHA fixes the subject of the trust, and it creates the
# problem this file exists to solve: a security fix upstream does not arrive by itself.
#
# Dependabot closes that loop without giving up the pin. For `github-actions` it updates the
# SHA *and* the `# vX` comment beside it, so the workflow keeps both properties — immutable
# subject, visible version — and the update arrives as a pull request that CI validates
# before anyone merges it. That is the sync mechanism; pinning without it would be the
# "silently stuck on an old action" failure mode.
#
# `cargo` is here for the same reason: `Cargo.lock` is committed, so the dependency set is
# pinned too, and a fix only arrives if something proposes the bump. (Advisories are already
# caught automatically — `cargo-deny` runs in the Deep workflow and fails on an advisory that
# lands on a locked crate — but "caught" and "fixed" are different events.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR for all action bumps: they are all "a SHA moved", they are validated by the
    # same CI run, and five separate PRs to merge for one weekly batch is friction that
    # would push people back towards unpinned tags.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps ride together; a major bump gets its own PR, because that is
      # the one a human has to read (an MSRV or API change, and `cargo-deny`'s licence and
      # duplicate policies have bitten on major bumps before).
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # criterion 0.8 pulls in `alloca 0.4.0`, whose build script wants a C cross-compiler:
      #
      #   warning: alloca@0.4.0: Compiler family detection failed ... failed to find tool
      #   "aarch64-linux-gnu-gcc"
      #   error: failed to run custom build command for `alloca v0.4.0`
      #
      # This repository has no cross C toolchain *on purpose* — that is what the `pure`
      # feature and the self-contained musl crates are for — and the bump turned seven
      # checks red because of it (Miri, the mutation check, the i686 and aarch64 qemu
      # executions, three cross-checks). Dependabot PR #4 was closed with this measurement;
      # the ignore is so it does not come back weekly. A benchmark-harness update, if ever
      # wanted, is a branch with a provisioning decision in it, not a dependency bump.
      - dependency-name: criterion
      # `chacha20poly1305` and `aead` are the benchmark reference (and each other's
      # transitive dependency), and they must move *together*: 0.11 depends on `aead` 0.6,
      # so bumping either alone leaves the bench importing traits from a major version the
      # cipher does not implement - which is exactly how PRs #2 and #5 failed (`E0599` on
      # `ChaChaPoly1305::new`). Paired, they trip the lint gate instead: `aead` 0.6 deprecates
      # `AeadInPlace`/`encrypt_in_place_detached` in favour of `AeadInOut`, so
      # `clippy --all-targets -- -D warnings` reports nine errors in `benches/compare.rs`
      # until those call sites are migrated.
      #
      # Measured before deciding (median of two alternating runs, encrypt @ 16 KiB / 1 MiB):
      # the reference is 9.78 -> 9.65 µs and 551.0 -> 544.4 µs, i.e. ~1% - inside the noise
      # floor of a two-checkout comparison (the same crate measured up to 8% apart between the
      # two trees). So the README's ratios, which name the reference version explicitly, do not
      # go stale, and the upgrade buys a dev-only dependency being current.
      #
      # Ignored for *version* updates with the reasoning recorded; advisory detection is not
      # affected, because `cargo-deny` fails the Deep workflow if an advisory reaches the
      # lockfile. Do the migration when the performance table is next refreshed - that is the
      # commit where the numbers are re-measured anyway.
      - dependency-name: chacha20poly1305
      - dependency-name: aead
