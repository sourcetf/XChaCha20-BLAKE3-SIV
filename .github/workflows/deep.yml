# The audit checks that need external tooling: Miri, ctgrind, cargo-deny, fuzzing.
#
# Kept out of ci.yml because each needs its own install and they are much slower
# than the ordinary test suite. Like formal.yml, this is not a gate for releases;
# it exists so the checks in tests/README.md actually run somewhere other than one
# developer's machine.
#
# Every step here was verified locally first. Where a tool needed a workaround to
# run at all, the workaround is in the step and the reason is in a comment.

name: Deep checks

on:
  # `workflow_dispatch` exists for the jobs that depend on runner availability or on
  # someone deciding to spend the time -- the real-hardware ARM job, and re-running
  # the wide audit on demand. Neither is gated on every push.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a toolchain or tool regression does not go unnoticed just
    # because the source is unchanged.
    - cron: "0 4 * * 1"

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Miri is only available on nightly; on stable, `rustup component add miri`
      # fails with "component 'miri' is unavailable for download".
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      # `--features pure` throughout: Miri cannot execute BLAKE3's C kernels, so
      # the portable Rust backend is what makes these runs possible at all.
      #
      # Miri cannot run `__cpuid_count` (inline asm) either, so `detect_avx2` falls
      # back to the compiled feature set under `cfg(miri)` and this exercises the SSE2/transpose/zeroization
      # paths — which is where the alignment-sensitive `unsafe` is.
      #
      # `-Zmiri-strict-provenance` turns int-to-pointer casts into errors, which
      # is what actually checks the raw-pointer arithmetic in `zeroize_slice` /
      # `zeroize_array` (and the tag-buffer wipe in `Plaintext::drop`).
      - name: miri on the unsafe paths
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance" \
            cargo +nightly miri test --release --features pure --lib -- \
              test_zeroize_covers_unaligned_prefix \
              test_x86_simd_kernels_match_scalar \
              test_simd_xor_matches_scalar_and_raw \
              test_empty_inputs \
              test_detached_matches_attached

      # The same tests under Miri's *other* aliasing model. Stacked Borrows
      # (the default) and Tree Borrows disagree about some programs, so passing
      # one is not evidence for the other; the code under test here is exactly
      # the kind that sits in the gap (raw pointers derived from a `&mut`).
      - name: miri, tree borrows
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance -Zmiri-tree-borrows" \
            cargo +nightly miri test --release --features pure --lib -- \
              test_zeroize_covers_unaligned_prefix \
              test_x86_simd_kernels_match_scalar \
              test_simd_xor_matches_scalar_and_raw \
              test_empty_inputs \
              test_detached_matches_attached

      # `detect_avx2` reports the *compiled* feature set under Miri (it cannot run
      # CPUID there), so the default run above takes the SSE2 path and this one
      # runs the AVX2 kernel as well -- unaligned 256-bit stores, the 8x8
      # transpose, the volatile wipe. Miri refuses a `#[target_feature]` call
      # whose feature is not enabled, so enabling it is what makes this legal.
      - name: miri, avx2 kernel
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance" \
            RUSTFLAGS="-C target-feature=+avx2" \
            cargo +nightly miri test --release --features pure --lib -- \
              test_x86_simd_kernels_match_scalar \
              test_simd_xor_matches_scalar_and_raw \
              test_simd_matches_scalar_all_lengths

      # The NEON kernel only exists on aarch64, and this is the only way Miri can
      # reach it: cross-interpretation. `miri setup` builds that sysroot from
      # rust-src, so no `rustup target add` is needed.
      - name: miri, neon kernel (aarch64)
        run: |
          cargo +nightly miri setup --target aarch64-unknown-linux-gnu >/dev/null
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance" \
            cargo +nightly miri test --release --features pure --target aarch64-unknown-linux-gnu --lib -- \
              test_aarch64_neon_kernel_matches_scalar \
              test_simd_xor_matches_scalar_and_raw \
              test_zeroize_covers_unaligned_prefix

  tsan:
    name: ThreadSanitizer (concurrency)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # ThreadSanitizer needs nightly *and* the rust-src component: std ships
      # uninstrumented, and mixing it with an instrumented crate is an ABI mismatch
      # that rustc refuses outright, so the run rebuilds std with -Zbuild-std.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tsan

      # `tools/tsan.sh` runs a negative control before the real thing: a
      # deliberately racy test must be *reported* (and the test is #[ignore]d, so
      # nothing else can reach it), because a clean run from a sanitizer that was
      # silently dropped from the flags looks exactly like a clean run from one
      # that was not.
      - name: ThreadSanitizer over the concurrency test
        run: bash tools/tsan.sh

  ctgrind:
    name: ctgrind (constant-time)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ctgrind

      # On a runner this is just an apt install; locally it is not, which is why
      # tools/ctgrind.sh can also find an extracted copy.
      - name: install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
          valgrind --version

      # The script runs its own negative control first and refuses to report a
      # clean result unless valgrind flags it, so this cannot pass vacuously.
      - name: run ctgrind
        run: ./tools/ctgrind.sh

      # The `hardened` decision adds two recomputed tag comparisons and a branch,
      # which is exactly the shape that could introduce a content-dependent timing
      # difference. Same check, same build flags, different feature set.
      - name: run ctgrind with the hardened decision
        run: ./tools/ctgrind.sh --features hardened

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      # cargo-deny (next job) also checks advisories, but through its own engine and
      # its own pinned database; running both is deliberate rather than redundant --
      # a miss in one is not a miss in the other.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: audit the dependency tree
        run: cargo audit --deny warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deny

      # The tool is named explicitly rather than through the `@cargo-deny` ref
      # shorthand: when a ref is not one of install-action's tool tags, the
      # action warns "no tool specified" and exits *successfully*, so the failure
      # only shows up later as `no such command` in the step that needs it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # github.com is reachable from a runner, so the advisory database fetches
      # normally here — unlike on the development machine, where it had to be
      # fetched through the GitHub API and placed where cargo-deny looks.
      - name: cargo deny check
        run: cargo deny check

  # The checks above can be silently vacuous, and one of them was: the ctgrind
  # negative control was compiled into a branchless `setcc` that memcheck does not
  # report, and the "must exit 99" guard was being satisfied by unrelated startup
  # noise, so the harness was green while proving nothing. A mutation check is
  # what catches that class: plant a known bug and require the check to fail.
  reproducible:
    name: deterministic build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: reproducible

      # Two clean builds of the same source in different directories, with the
      # source and registry paths normalised, must produce byte-identical files.
      # What this establishes is determinism for one toolchain and one dependency
      # set (`--locked`): the recipe is path-normalised on purpose, because absolute
      # build paths are the usual reason two builds differ. What it does *not*
      # establish is reproducibility across machines and toolchains -- that needs
      # the same compiler version, and the C toolchain as well, since BLAKE3's
      # kernels are compiled by `cc`.
      - name: build twice and compare
        run: |
          set -euo pipefail
          remap="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          for d in a b; do
            RUSTFLAGS="$remap" CARGO_TARGET_DIR="$PWD/target-$d" \
              cargo build --release --locked --example xsiv_stdin
          done
          sha256sum target-a/release/examples/xsiv_stdin target-b/release/examples/xsiv_stdin
          if cmp -s target-a/release/examples/xsiv_stdin target-b/release/examples/xsiv_stdin; then
            echo "OK: the two builds are byte-identical"
          else
            echo "FAIL: the build is not deterministic under path normalisation" >&2
            exit 1
          fi

  mutation:
    name: verify the verifier (mutation check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation

      # One of the mutations is caught by ctgrind, which needs valgrind.
      - name: install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
          valgrind --version

      # The fault-injection counterpart: it writes a fault down as a source change,
      # requires the *default* build to accept a forgery with it (so the fault is
      # real), and requires the `hardened` build to reject it anyway.
      - name: fault-injection check of the decision
        run: ./tools/fi_check.sh

      - name: plant bugs and require the checks to fail
        run: ./tools/mutation_check.sh

  coverage:
    name: coverage and dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Informational, not a gate. A percentage threshold on this crate would be a
    # guess: the aarch64, big-endian and AVX2 kernels cannot all be executed on one
    # runner (the cross-exec jobs cover them under qemu, where the profiler cannot
    # follow), so a defensible floor would need per-target exclusions and would
    # reward editing the exclusions. What is useful is the artifact: it shows which
    # paths a change stopped exercising.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: coverage over the suite
        run: |
          set -euo pipefail
          # Same feature set and profile in both invocations: `report` locates the
          # instrumented artefacts by re-resolving the cargo arguments, and the
          # first version of this job passed `--all-features --release` to the run
          # but not to the report, which failed with "not found object files" after
          # every test had already passed.
          cargo llvm-cov --all-features --release --summary-only
          cargo llvm-cov report --all-features --release --lcov --output-path lcov.info

      # An inventory, deliberately not labelled an SBOM: a CycloneDX or SPDX
      # document needs a generator that is not installed here, and calling
      # `cargo metadata` output an SBOM would be using the word for something it is
      # not. This still answers "what is in the tree" for a given commit.
      - name: dependency inventory
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > dependencies.json
          cargo tree --edges normal > dependencies.txt
          cargo tree --edges normal | sort -u | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-dependencies
          path: |
            lcov.info
            dependencies.json
            dependencies.txt

  wide:
    name: wide audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The checks that are too slow or too noisy to gate every push, run every night
    # instead of never: the 4000-vector differential against the reference
    # implementation, AddressSanitizer over the whole suite (the fuzz job only
    # covers the fuzz target), and the full Miri suite under Tree Borrows -- the
    # aliasing model that is *not* the default, so nothing else exercises it at
    # this scale.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wide

      - name: install the blake3 module for the reference implementation
        run: python3 -m pip install --quiet blake3

      # `examples/xsiv_stdin.rs` is the batch interface it drives, so this exercises
      # the crate's real encryption path over thousands of random inputs.
      - name: 4000 random vectors against the independent reference
        run: python3 tools/broad_differential.py 4000

      - name: AddressSanitizer over the whole suite
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test --release --features pure \
            --target x86_64-unknown-linux-gnu

      - name: Miri, full library suite under Tree Borrows
        run: |
          set -euo pipefail
          rustup component add miri --toolchain nightly
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance -Zmiri-tree-borrows" \
            cargo +nightly miri test --release --features pure --lib

      # 15 minutes across every core the runner has, versus the two the push-time
      # job spends. The scheduled run is where coverage-of-time is affordable.
      - name: fifteen minutes of fuzzing on every core
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          workers="$(nproc)"
          cargo +nightly fuzz run roundtrip --target x86_64-unknown-linux-gnu -- \
            "-workers=$workers" "-jobs=$workers" -max_total_time=900 -print_final_stats=1

  arm64:
    name: real aarch64 hardware (dispatch only)
    # `ubuntu-24.04-arm` is a hosted ARM64 runner, and its availability is not
    # something this repository controls -- so this job runs only when someone
    # dispatches the workflow, which is also the only honest moment to spend ten
    # minutes of runner time on numbers that are informational.
    #
    # Why it exists: every other aarch64 check in this repository *executes* the
    # NEON kernel under qemu (correctness), and qemu cannot model aarch64
    # performance -- so the README has always said the NEON figures need real
    # hardware. This is where they come from.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64

      - name: what is this machine
        run: |
          uname -m
          grep -m1 "model name\|CPU part\|Features" /proc/cpuinfo || true
          nproc

      # `blake3` uses its C kernels here (a compiler is available), which is what
      # the crate ships by default.
      - name: round trip against XChaCha20-Poly1305, in one process
        run: |
          for size in 64 256 1024 4096 16384 65536 1048576; do
            cargo run --release --quiet --example profile_probe "$size" 2000
          done

      - name: the head-to-head criterion table as well
        run: cargo bench --bench compare -- --noplot

  fuzz:
    name: fuzzing (libFuzzer + ASAN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # This job was red for exactly this reason: `@cargo-fuzz` is not one of
      # install-action's tool tags, so the action warned "no tool specified",
      # exited 0, and `cargo fuzz` then failed with "no such command: fuzz" --
      # the job never fuzzed anything. Name the tool, and keep a source build as
      # a fallback so the fuzzer runs even if the action cannot provide it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Bounded rather than indefinite: the scheduled run is the soak. The target
      # asserts round-trip correctness, rejection of every single-bit corruption,
      # and the wipe-on-failure contract, so a failure is a defect.
      #
      # `--target` is not optional. cargo-fuzz's default target is
      # `current_platform::CURRENT_PLATFORM`, a *compile-time constant of the
      # cargo-fuzz binary itself*; install-action falls back to cargo-binstall on
      # Linux, which downloads the musl build, so the default becomes
      # x86_64-unknown-linux-musl — and ASan refuses to link a static musl
      # ("sanitizer is incompatible with statically linked libc"), which is how
      # this job failed even after the tool was installed. Naming the host triple
      # keeps the sanitizer build on glibc whichever way the tool arrived.
      - name: fuzz
        run: |
          set -euo pipefail
          command -v cargo-fuzz >/dev/null || cargo install --locked cargo-fuzz
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          echo "fuzzing for host triple: $host"
          cargo +nightly fuzz run roundtrip --target "$host" \
            -- -max_total_time=300 -print_final_stats=1

      # A crashing input is written to fuzz/artifacts; upload it so the failure
      # is reproducible rather than just reported.
      - name: upload any crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore