name: Retry a run the runner shut down

# Why this exists, precisely: a hosted runner sometimes stops a job mid-step and says so
# in its own log --
#
#   ##[error]The runner has received a shutdown signal. This can happen when the runner
#   service is stopped, or a manually started runner is canceled.
#   ##[error]The operation was canceled.
#
# Measured on 2026-10-21: `Deep checks` #213 (run 39628640338) lost 17 of its 42 sweep
# jobs that way, and the re-run (run 39639772764) lost 6 of its first 10, at 15-51
# minutes into the step, while every shorter job in the same runs (Miri, TSAN, fuzzing,
# ctgrind) passed. The sweep is a 20-way split whose verdict refuses an incomplete set of
# reports, so a runner that is stopped with no finding behind it turns the whole audit
# red. The failures cluster in time across VMs (17:33-17:50 on the second run), which is
# the platform rebalancing hosts, not anything the job does -- the logs show the sweep
# progressing normally right up to the shutdown signal, with no OOM, disk or tool error.
#
# What this does, and what it deliberately does not: it re-runs the stopped jobs of such a
# run, once, bounded, and **only when every failed job carries one of the runner's own
# shutdown annotations**. A job that failed with a verdict -- the sweep's FAIL lines, a
# test failure, a tool error, the verdict job's arithmetic -- carries a different
# annotation and is not retried, so this cannot turn a real finding into a green run by
# repetition. The retried run's own conclusion is the one that counts, and `Deep checks`'
# verdict job still requires all twenty reports per model, so coverage is unchanged: the
# re-run replaces work an evicted runner took with it, nothing else.
#
# A job the runner stopped may be reported as `cancelled`, not `failure`.
# `rerun-failed-jobs` is documented for *failed* jobs; whether it also re-runs cancelled
# ones is not guaranteed. When a classified job is cancelled, this workflow therefore
# uses `runs/{id}/rerun` (all jobs) instead, which definitely restores every stopped job.
# All-jobs is more expensive, but it is only chosen for the runner-shutdown case.
#
# The attempt bound (`run_attempt < 5`) is what keeps this from looping: GitHub increments
# it on every re-run, so a fleet that keeps evicting runners gives up after four retries
# and leaves the run red rather than retrying forever.

on:
  workflow_run:
    workflows: ["Deep checks"]
    types: [completed]

permissions:
  actions: write  # `runs/{id}/rerun` and `rerun-failed-jobs`
  checks: read    # `check-runs/{id}/annotations`, where the shutdown wording lives

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5 &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: re-run the failed jobs if the runner stopped them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(mktemp)"
          # Keep the name/conclusion plus timestamps. Workflow runs from forks are
          # excluded by the job-level `if`: their annotations are controlled by the PR
          # author, and a re-run with write permission must not let a fork turn a real
          # failure green on attempt 2. The timestamps distinguish a runner shutdown
          # from a job killed by its own timeout-minutes.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.id)\t\(.name)\t\(.conclusion)\t\(.started_at)\t\(.completed_at)"' > "$jobs"
          if [ ! -s "$jobs" ]; then
            echo "No failed jobs to consider."
            exit 0
          fi

          # A job id doubles as its check-run id, and the annotations are where the
          # runner's own wording survives: "received a shutdown signal" and "lost
          # communication with the server" are infrastructure; "The operation was
          # canceled" is the generic wording the service pairs with them; and exit 143
          # is SIGTERM, which is how the step process is ended when the runner service
          # stops (measured: 5 lost-communication, 10 canceled and 1 exit 143 in run
          # 39639772764). A verdict or a FAIL line matches none of these.
          infra=0
          cancelled_infra=0
          other=0
          derived=0
          while IFS=$'\t' read -r id name conclusion started completed; do
            # The verdict job aggregates the shards: when a shard was stopped by the
            # runner, the verdict necessarily fails on the missing report, and its
            # annotation says so in ordinary FAIL words. It is exempt from the
            # classification, but only counts as recoverable when at least one real
            # infra failure exists (checked below); a verdict-only failure is a finding.
            if [ "$name" = "wide audit (sweep verdicts)" ]; then
              derived=$((derived + 1))
              continue
            fi
            notes="$(gh api --paginate "repos/$REPO/check-runs/$id/annotations" --jq '.[].message')"
            # A job killed by its own `timeout-minutes` also says "The operation was
            # canceled". Do not retry that; a budget hit is a result, not lost work.
            # The sweep jobs have 60-minute budgets and the wide jobs 300; the runner
            # shutdowns that motivated this file were 15-51 minutes in, so 55 minutes
            # separates them without hard-coding job names.
            duration=0
            if start_epoch="$(date -d "$started" +%s 2>/dev/null)" &&
               end_epoch="$(date -d "$completed" +%s 2>/dev/null)"; then
              duration=$((end_epoch - start_epoch))
            fi
            # `case`, not `printf ... | grep -q`: under `pipefail` grep exits at its
            # first match, a large annotation set gives printf SIGPIPE, and the
            # pipeline reports 141 -- so a real shutdown is read as "some other
            # failure" and a recoverable run stays red.
            case "$notes" in
              *"received a shutdown signal"*|*"lost communication with the server"*|*"exit code 143"*)
                infra=$((infra + 1))
                if [ "$conclusion" = "cancelled" ]; then
                  cancelled_infra=$((cancelled_infra + 1))
                fi
                ;;
              *"The operation was canceled"*)
                if [ "$duration" -ge 3300 ]; then
                  other=$((other + 1))
                  echo "job $id was cancelled after $duration s; that is a timeout, not a runner shutdown"
                else
                  infra=$((infra + 1))
                  if [ "$conclusion" = "cancelled" ]; then
                    cancelled_infra=$((cancelled_infra + 1))
                  fi
                fi
                ;;
              *)
                other=$((other + 1))
                echo "job $id did not carry a runner-shutdown annotation:"
                sed -n '1,3s/^/    /p' <<<"$notes"
                ;;
            esac
          done < "$jobs"

          if [ "$other" -ne 0 ]; then
            echo "$other failed job(s) were not stopped by the runner; leaving the run red."
            exit 0
          fi
          if [ "$infra" -eq 0 ]; then
            # Only the derived verdict failed: that is its own finding, not lost work.
            echo "No job carries a runner-shutdown annotation (derived verdict job: $derived); leaving the run red."
            exit 0
          fi
          if [ "$cancelled_infra" -gt 0 ]; then
            # `rerun-failed-jobs` is documented for failed jobs; a runner-stopped job
            # can be reported as cancelled, and that endpoint is not guaranteed to
            # restore it. `/rerun` re-runs every job, so no stopped shard is left out.
            echo "Re-running all jobs because $cancelled_infra of $infra runner-stopped job(s) are cancelled, plus $derived derived verdict job(s) (attempt $((RUN_ATTEMPT)))."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun"
          else
            echo "Re-running $infra failed job(s) stopped by the runner plus $derived derived verdict job(s) (attempt $((RUN_ATTEMPT)))."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          fi
