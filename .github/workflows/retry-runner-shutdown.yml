name: Retry a run the runner shut down

# Why this exists, precisely: a hosted runner sometimes stops a job mid-step and says so
# in its own log --
#
#   ##[error]The runner has received a shutdown signal. This can happen when the runner
#   service is stopped, or a manually started runner is canceled.
#   ##[error]The operation was canceled.
#
# Measured on 2026-10-21: `Deep checks` #213 (run 39628640338) lost 17 of its 42 sweep
# jobs that way, and the re-run (run 39639772764) lost 6 of its first 10, at 15-51
# minutes into the step, while every shorter job in the same runs (Miri, TSAN, fuzzing,
# ctgrind) passed. The sweep is a 20-way split whose verdict refuses an incomplete set of
# reports, so a runner that is stopped with no finding behind it turns the whole audit
# red. The failures cluster in time across VMs (17:33-17:50 on the second run), which is
# the platform rebalancing hosts, not anything the job does -- the logs show the sweep
# progressing normally right up to the shutdown signal, with no OOM, disk or tool error.
#
# What this does, and what it deliberately does not: it re-runs the failed jobs of such a
# run, once, bounded, and **only when every failed job carries one of the runner's own
# shutdown annotations**. A job that failed with a verdict -- the sweep's FAIL lines, a
# test failure, a tool error, the verdict job's arithmetic -- carries a different
# annotation and is not retried, so this cannot turn a real finding into a green run by
# repetition. The retried run's own conclusion is the one that counts, and `Deep checks`'
# verdict job still requires all twenty reports per model, so coverage is unchanged: the
# re-run replaces work an evicted runner took with it, nothing else.
#
# The attempt bound (`run_attempt < 5`) is what keeps this from looping: GitHub increments
# it on every re-run, so a fleet that keeps evicting runners gives up after four retries
# and leaves the run red rather than retrying forever.

on:
  workflow_run:
    workflows: ["Deep checks"]
    types: [completed]

permissions:
  actions: write  # `rerun-failed-jobs`
  checks: read    # `check-runs/{id}/annotations`, where the shutdown wording lives

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: re-run the failed jobs if the runner stopped them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(mktemp)"
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .id' > "$jobs"
          if [ ! -s "$jobs" ]; then
            echo "No failed jobs to consider."
            exit 0
          fi

          # A job id doubles as its check-run id, and the annotations are where the
          # runner's own wording survives: "received a shutdown signal" and "lost
          # communication with the server" are infrastructure; "The operation was
          # canceled" is the generic wording the service pairs with them; and exit 143
          # is SIGTERM, which is how the step process is ended when the runner service
          # stops (measured: 5 lost-communication, 10 canceled and 1 exit 143 in run
          # 39639772764). A verdict or a FAIL line matches none of these.
          infra=0
          other=0
          while read -r id; do
            notes="$(gh api --paginate "repos/$REPO/check-runs/$id/annotations" --jq '.[].message')"
            # `case`, not `printf ... | grep -q`: under `pipefail` grep exits at its
            # first match, a large annotation set gives printf SIGPIPE, and the
            # pipeline reports 141 -- so a real shutdown is read as "some other
            # failure" and a recoverable run stays red.
            case "$notes" in
              *"received a shutdown signal"*|*"lost communication with the server"*|*"The operation was canceled"*|*"exit code 143"*)
                infra=$((infra + 1))
                ;;
              *)
                other=$((other + 1))
                echo "job $id did not carry a runner-shutdown annotation:"
                sed -n '1,3s/^/    /p' <<<"$notes"
                ;;
            esac
          done < "$jobs"

          if [ "$other" -ne 0 ]; then
            echo "$other failed job(s) were not stopped by the runner; leaving the run red."
            exit 0
          fi
          echo "Re-running $infra job(s) stopped by the runner (attempt $((RUN_ATTEMPT)))."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
