# Formal verification: Kani bounded model checking of the construction
# properties.
#
# Kept separate from ci.yml because it is orders of magnitude slower -- the one
# harness that executes the real 20-round permutation takes tens of minutes on a
# 16-core machine, and a CI runner is slower still.
#
# Relationship to releases: the release job in ci.yml is gated on the CI jobs
# only, so a release can exist for a commit whose proofs are still running. If
# you want the proofs to block releases (defensible for a cryptographic
# library), add a `workflow_run` trigger on this workflow and gate the release
# there -- cross-workflow ordering cannot be expressed with `needs`.
#
# The harness set is derived from the source by tools/kani_shards.py rather than
# listed here, so a newly added `#[kani::proof]` is picked up automatically. A
# hardcoded list would silently stop covering new harnesses, and "the proofs
# still pass" would quietly mean less than it used to.
#
# Every `uses:` is pinned to a full commit SHA (the moving tag is kept in a comment), so a
# third-party action cannot change under this workflow without a commit here. See the same
# note at the top of ci.yml for how to update them.

name: Formal verification

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a Kani, CBMC or Rust nightly regression cannot go unnoticed just
  # because the source did not change.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  # Per-event group for the same reason as `deep.yml`: a push to `main` and the
  # weekly `schedule` share `refs/heads/main`, so a push at 03:00 used to cancel the
  # weekly proof run — and it reported as "cancelled", so the missing verification
  # looked like an infrastructure hiccup. Isolating the schedule keeps the proofs
  # (and keeps superseding a previous push or PR run for the same event).
  group: formal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned to the version whose behaviour is described in src/proofs.rs. Kani is
  # a research tool: its cost model and even its harness semantics have shifted
  # between releases, so an unpinned version could make a harness that passes
  # today fail tomorrow for reasons unrelated to this crate.
  KANI_VERSION: "0.68.0"

jobs:
  # Derive the shard plan from the source, and fail if it does not account for
  # every harness.
  plan:
    name: plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      # `--plan` exits non-zero if any harness matches no shard, or if the
      # grouped counts do not add up to the number found in the source. That is
      # the guard against silently under-covering the suite.
      - name: derive the shard matrix
        id: plan
        run: |
          set -euo pipefail
          count="$(python3 tools/kani_shards.py --count)"
          matrix="$(python3 tools/kani_shards.py --plan)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$(printf '%s' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "harnesses found: $count"
          printf '%s\n' "$matrix" | python3 -m json.tool

  prove:
    name: prove (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One shard failing must not cancel the others: the full picture of what
      # is and is not proven is the useful output.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: kani-${{ matrix.shard }}

      # Installing Kani is the slowest step, so cache both the tool and the
      # binaries `cargo-kani setup` fetches (the Rust nightly and CBMC).
      - name: cache Kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/kani-driver
            ~/.cargo/bin/kani-compiler
            ~/.cargo/bin/kani-cov
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: install Kani ${{ env.KANI_VERSION }}
        run: |
          set -euo pipefail
          if command -v cargo-kani >/dev/null 2>&1; then
            echo "cargo-kani already present; verifying setup is complete"
          else
            cargo install --locked --version "$KANI_VERSION" kani-verifier
          fi
          # Fetches the matching Rust nightly and CBMC. Idempotent.
          cargo-kani setup
          # A preinstalled/cached cargo-kani is not necessarily the pinned version.
          # Harness semantics and counts are version-sensitive, so assert it.
          version_line="$(cargo kani --version)"
          echo "$version_line"
          case "$version_line" in
            *"$KANI_VERSION"*) ;;
            *)
              echo "::error::cargo kani reports '$version_line', expected version $KANI_VERSION"
              exit 1 ;;
          esac

      # -Z stubbing is REQUIRED: several harnesses use #[kani::stub] to replace
      # the ChaCha20 permutation, the zeroization helper and the BLAKE3
      # commitment with cheap stand-ins. Without it Kani rejects the attribute
      # and the suite fails to compile. See the src/proofs.rs module docs for
      # the cost model behind that decision.
      #
      # `--extra-pointer-checks` costs memory, and that is why this job ran with
      # it off: the heaviest harness then needed ~20 GB of CBMC formula, which is
      # past what a hosted runner has. That turned out to be a property of the
      # harness rather than of the flag -- with its input shapes written as
      # separate call sites (see src/proofs.rs) the whole tag shard verifies in
      # 3:11 with a 2.1 GB peak *with* the checks on, so they are on here. They
      # ask CBMC about pointer validity and same-allocation on every access,
      # which is the class of bug this shard exists to catch.
      - name: prove this shard
        shell: bash
        run: |
          set -euo pipefail

          # Every harness name is passed explicitly, but Kani does not fail when
          # *one of several* --harness filters matches nothing: with a valid and
          # a bogus name it exits 0 having verified the valid one (measured on
          # Kani 0.68.0, this workflow's pin). A renamed or cfg-disabled harness
          # would therefore shrink the shard silently. The summary below is
          # checked against the number of names requested instead.
          # `-j`: Kani's default is one harness at a time, which leaves the
          # runner's cores idle. The harnesses in a shard are independent, and
          # the per-shard job count is in tools/kani_shards.py along with the
          # memory measurement behind it. `--output-format=terse` is required by
          # `-j` for more than one job, and dropped for one so a failure keeps
          # its detail.
          jobs="${{ matrix.jobs }}"
          args=(-j "$jobs" -Z stubbing --features pure -Z unstable-options --extra-pointer-checks)
          if [ "$jobs" -gt 1 ]; then args+=(--output-format=terse); fi
          n=0
          for h in ${{ matrix.harnesses }}; do
            args+=(--harness "$h")
            n=$((n + 1))
          done

          echo "proving $n harness(es) in shard '${{ matrix.shard }}':"
          for h in ${{ matrix.harnesses }}; do echo "  - $h"; done
          echo

          # `--features pure`: keep the proofs on BLAKE3's portable backend, the
          # configuration they were developed against (Kani never reaches BLAKE3
          # -- every harness stubs the one seam -- but it does build it).
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          cargo kani "${args[@]}" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          # Kani reports its own count: "Complete - N successfully verified
          # harnesses, F failures, T total." T must equal the number of names
          # passed above, or a name that matched nothing reduced the shard while
          # the job stayed green.
          summary="$(grep -E 'Complete - [0-9]+ successfully verified harnesses, [0-9]+ failures, [0-9]+ total' "$log" | tail -n 1 || true)"
          if [ -z "$summary" ]; then
            echo "FAIL: Kani printed no 'Complete - ...' summary, so the number of" >&2
            echo "      harnesses actually verified cannot be checked." >&2
            exit 1
          fi
          counts="$(sed -nE 's/.*Complete - ([0-9]+) successfully verified harnesses, ([0-9]+) failures, ([0-9]+) total.*/\1 \2 \3/p' <<<"$summary")"
          if [ -z "$counts" ]; then
            echo "FAIL: could not parse Kani's summary: $summary" >&2
            exit 1
          fi
          read -r verified failed total <<<"$counts"
          if [ "$failed" -ne 0 ] || [ "$total" -ne "$n" ]; then
            echo "FAIL: this shard requested $n harness(es) and Kani reports" >&2
            echo "      $verified verified, $failed failed, $total total. A name that" >&2
            echo "      matched no harness (renamed, cfg-disabled, commented out) is" >&2
            echo "      silently dropped by Kani when another name matches." >&2
            exit 1
          fi
          echo "Kani verified all $verified requested harness(es)."
