# Continuous integration: lint, test, cross-check, execute the cross-target suites,
# and re-check the differential fixture against the independent reference
# implementation.
#
# Once every job here passes on `main`, the `release` job tags the commit and
# publishes a release.  See .github/workflows/formal.yml for the Kani proofs,
# which are kept separate because they take far longer than everything here
# combined.
#
# Every `uses:` below is pinned to a full commit SHA with the moving tag in a
# comment, so the code CI executes is a fixed object rather than whatever a tag
# points at this week (an auditor raised this: the repository argues for
# reproducible builds and then ran unpinned third-party code on every push).
#
# The trade-off is real and it is paid for rather than ignored: pinning also
# means a security fix upstream does not arrive by itself. `.github/dependabot.yml`
# is the other half — it updates the SHA *and* the `# vX` comment beside it and
# opens a PR that CI validates, weekly, so the repository cannot silently sit on
# an old action. To do it by hand instead:
#   gh api repos/actions/checkout/commits/v7 --jq .sha
# (Relaxing to `@v7` would put the fix path back but hand the decision of *what
# runs here* to whoever can move that tag — which is the attack this pinning
# exists to close: in the release job, where the token has `contents: write`,
# that means the published release artifacts. See the header of dependabot.yml.)
#
# One action needs care beyond the pin: `dtolnay/rust-toolchain` takes the
# toolchain's *name from its ref*, so a bare SHA pin would leave the nightly and
# 1.85.0 jobs resolving to whatever that SHA's branch happens to be — and when
# Dependabot groups a bump it replaces all three refs with the default branch's
# SHA at once, which is how it was found: the update PR's TSAN job failed with
# `rust-src` missing for the *stable* toolchain, because "nightly" had become
# stable. Measured on main's logs: the action does resolve the toolchain from the
# pinned SHA's branch, so the per-branch pins were right; the grouping is what
# breaks them. Fix: name the toolchain explicitly with `with: toolchain: …` at
# every use, which makes any SHA safe and keeps the updates flowing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes an in-flight run rather than queueing
# behind it -- but **only for pull requests**. On `main` a run carries the
# `release` job, which tags the commit and uploads the manifest and the three
# bundles; `gh release create`/`upload` is not atomic, so superseding a
# main run mid-publish can leave a partially-populated release -- the exact
# outcome the publish step works to prevent. So pushes to `main` are not
# cancelled; they queue, and each publishes its own `sha-<commit>` tag, which is
# safe. (Found while auditing the release job: the unconditional
# `cancel-in-progress: true` reached the release too.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless in CI (nothing is reused between runs)
  # and only slow down the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint
      # `tools/gate_selftest.sh` drives `verify.sh`'s failure paths, and stage 1 of
      # verify.sh runs `tools/ref_impl.py`, which imports Python's `blake3`. Without
      # the module verify.sh fails before reaching the guard the selftest is checking,
      # so the selftest reports "failing for an unrelated reason". Pinned to the same
      # release as the differential jobs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: install the blake3 module for the gate selftest
        run: python3 -m pip install --quiet "blake3==1.0.11"

      - name: cargo fmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path blake3/Cargo.toml -- --check

      # Both feature sets: `rng` gates a public module, so a warning there
      # would otherwise only surface once someone enabled the feature.
      - name: clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The source-only policy depends on two manifests staying in a shape that no
      # registry dependency can silently replace. Check the resolved graph, not the
      # source text: exactly one `blake3`, reached by the local path, and the parent's
      # default feature set still includes `hardened`.
      - name: dependency provenance and default feature set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path

          def metadata(*args):
              out = subprocess.check_output(
                  ["cargo", "metadata", "--locked", "--format-version", "1", *args],
                  text=True,
              )
              return json.loads(out)

          root = metadata("--all-features")
          fuzz = metadata("--manifest-path", "fuzz/Cargo.toml")

          for label, m in (("root", root), ("fuzz", fuzz)):
              blake3 = [p for p in m["packages"] if p["name"] == "blake3"]
              assert len(blake3) == 1, f"{label}: expected exactly one blake3 package, found {len(blake3)}"
              pkg = blake3[0]
              assert pkg["source"] is None, f"{label}: blake3 is not the path package: {pkg['source']!r}"
              assert Path(pkg["manifest_path"]).parent.name == "blake3", pkg["manifest_path"]
              assert pkg["publish"] == [], f"{label}: vendored blake3 must keep publish = false"

          root_pkg = next(p for p in root["packages"] if p["name"] == "xchacha20-blake3-siv")
          assert "hardened" in root_pkg["features"].get("default", []), (
              "the default feature set lost hardened; the shipped default would be the "
              "single-gate build"
          )
          print("dependency graph: one path blake3, publish disabled, default includes hardened")
          PY
          # Any lock change here means the build and the audited lock are different
          # dependency sets. `--locked` above should already have refused, so this also
          # catches a tool that rewrote a lock without failing.
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock blake3/Cargo.lock

      - name: "vendored BLAKE3: own test suite"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path blake3/Cargo.toml
          cargo test --locked --release --manifest-path blake3/Cargo.toml --features pure

      # The tools' contract: "could not run" is exit 3, never 0, and the caller that
      # invokes them reports it as a skipped stage. A gate that regresses to exit 0
      # here fails this step rather than a summary line somewhere else.
      - name: gate contract (a gate that could not run must not exit 0)
        run: ./tools/gate_selftest.sh

      # `src/proofs.rs` is `#[cfg(kani)]`, so nothing above compiles it -- a
      # signature change to an internal function breaks the Formal job with no
      # local symptom, which is what happened to `derive_enc` and took all four
      # Kani shards down. This type-checks the harnesses against no-op stand-ins
      # for Kani's attributes. It proves nothing; it catches the break.
      - name: Kani harnesses still compile (--cfg kani, no-op shim)
        run: ./tools/check_kani_cfg.sh

      # Catches broken intra-doc links, which are invisible to `cargo test`.
      - name: rustdoc
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # `--no-default-features` is how a `no_std` user consumes this crate, and
      # nothing else exercises it. It was broken once: `zeroize` was an optional
      # dependency behind a default feature while the code used it
      # unconditionally, so the crate failed to build exactly where `no_std`
      # users would hit it. Cheap to check, so check it.
      - name: build with no default features
        run: cargo check --locked --no-default-features --all-targets

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cache` exists because `rust-cache` validates its key and refuses one
          # containing a comma, while `profile` reads `release, default features`:
          # measured, nine `ValidationError: Key Validation Error: v0-rust-test-release,
          # default features-Linux-x64-… cannot contain commas` annotations across the
          # legs of one run. The key is built from this field, never from the display
          # name, so the two can move independently.
          - profile: release, default features
            args: --release
            cache: release-default
          - profile: release, all features
            args: --release --all-features
            cache: release-all
          # Debug matters here beyond the usual reasons: `subtle`'s constant-time
          # guarantees are release-only (its Choice runs invariant checks in
          # debug), and this crate's own assertions and debug paths are only
          # exercised in a debug build.
          - profile: debug, all features
            args: --all-features
            cache: debug-all
          # `ultra` is a first-class configuration, not a combination that happens to be
          # covered by `--all-features`: it must build and pass on its own, because that
          # is how a user enables it and how a regression in its feature wiring shows up.
          - profile: release, ultra
            args: --release --features ultra
            cache: release-ultra
          # The opt-out build, so the single-gate configuration keeps its own witness.
          - profile: release, no default features
            args: --release --no-default-features
            cache: release-none
          # `locked` is a feature a caller can turn on by itself, and it used to gate
          # nothing at all: the module was under `ultra`, so `--features locked` compiled
          # an empty feature. This entry is what keeps that from happening again.
          - profile: release, locked alone
            args: --release --features locked
            cache: release-locked
          # `rng` alone, and the `no_std` shape of it (`--no-default-features --features
          # rng`): the feature adds a module and a dependency, and neither combination was
          # built anywhere.
          - profile: release, rng alone
            args: --release --features rng
            cache: release-rng
          - profile: release, no default features with rng
            args: --release --no-default-features --features rng
            cache: release-none-rng
          # `dual-mac` with the defaults *off*, which is the only configuration in which the
          # layer's invariant is observable: `dual-mac` must imply `hardened` (Cargo.toml's
          # edge), and `--features dual-mac` gets `hardened` from `default` whether that edge
          # is there or not, so a hand-edit that drops the edge is invisible from there.
          # `src/lib.rs` carries the matching `compile_error!`. Today the two spellings
          # resolve to the same feature set, which is why this row costs a build and
          # changes nothing else.
          - profile: release, no default features with dual-mac
            args: --release --no-default-features --features dual-mac
            cache: release-none-dualmac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # From `matrix.cache`, not from `matrix.profile`: the display name contains
          # commas and `rust-cache` refuses a key that does (the measurement is in the
          # matrix comment above).
          shared-key: test-${{ matrix.cache }}

      # `--skip timing` keeps `tests/timing.rs` out of the blocking run: on a
      # shared runner that screen cannot separate a real effect from a spurious
      # one (see the advisory `timing` job below for the measurements). Only that
      # target names its tests `timing_*`, so nothing else is affected.
      - name: cargo test
        run: |
          set -euo pipefail
          test_args="${{ matrix.args }}"
          # Deleting a whole test target is invisible to a run-based guard: the remaining
          # binaries still pass. Pin the expected target files themselves. The list is
          # deliberately literal; a new integration test must be added here, and
          # `tests/README.md` is the human index for it.
          for target in \
            tests/blake3_fork_equivalence.rs tests/construction_inventory.rs \
            tests/counter_range.rs tests/ctgrind.rs tests/decision.rs \
            tests/decision_scope.rs tests/differential_reference.rs tests/locked.rs \
            tests/mac_commitment.rs tests/plaintext_drop.rs tests/plaintext_wipe.rs \
            tests/security.rs tests/threads.rs tests/timing.rs tests/ultra.rs \
            tests/variable_latency.rs; do
            if [ ! -f "$target" ]; then
              echo "::error::expected test target $target is missing"
              exit 1
            fi
          done
          # File existence is not a built target: `autotests = false` (or a deleted
          # `[[test]]`) leaves every file in place while cargo builds none of them, and
          # the per-target run guard then sees zero headers and the zero-pass guard sees
          # its exemptions. Compare cargo's own target set with the same list, and refuse
          # an extra target as well so a new test cannot be added without the pin.
          #
          # A name alone is still not a run: metadata keeps listing a target with
          # `test = false`, a `[[test]]` whose `path` points somewhere else, or one
          # whose `required-features` are not enabled on a given leg. Check those fields
          # too; otherwise the pin passes while cargo runs nothing for that target.
          python3 - <<'PY'
          import json, os, subprocess, sys
          expected = {
              "blake3_fork_equivalence", "construction_inventory", "counter_range",
              "ctgrind", "decision", "decision_scope", "differential_reference",
              "locked", "mac_commitment", "plaintext_drop", "plaintext_wipe",
              "security", "threads", "timing", "ultra", "variable_latency",
          }
          meta = json.loads(
              subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])
          )
          packages = meta["packages"]
          tests = {
              t["name"]: t
              for package in packages
              for t in package["targets"]
              if "test" in t["kind"]
          }
          missing = sorted(expected - set(tests))
          unexpected = sorted(set(tests) - expected)
          disabled = sorted(name for name, t in tests.items() if not t.get("test", True))
          wrong_path = sorted(
              name for name, t in tests.items()
              if os.path.basename(t["src_path"]) != name + ".rs"
              or os.path.basename(os.path.dirname(t["src_path"])) != "tests"
          )
          requires_features = sorted(
              name for name, t in tests.items() if t.get("required-features")
          )
          libs = [
              t for package in packages for t in package["targets"] if "lib" in t["kind"]
          ]
          lib_tests_off = not any(t.get("test", True) for t in libs)
          if missing or unexpected or disabled or wrong_path or requires_features or lib_tests_off:
              print(
                  "::error::test target pin is out of date or not runnable; "
                  f"missing={missing} unexpected={unexpected} disabled={disabled} "
                  f"wrong_path={wrong_path} requires_features={requires_features} "
                  f"lib_tests_off={lib_tests_off}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          log="${RUNNER_TEMP:-/tmp}/cargo-test-${{ strategy.job-index }}.log"
          cargo test --locked ${{ matrix.args }} -- --skip timing 2>&1 | tee "$log"
          # A test target whose run reported **zero passed** executed nothing, even if it
          # reported ignored tests: marking the whole target `#[ignore]` is the same
          # vacuous result as emptying it. The exemptions below are only the targets that
          # are legitimately zero-passed in a given configuration (`ctgrind` outside the
          # static build, `timing` skipped here, doctests that compile out, and the two
          # whole-file feature gates in a leg that does not enable their feature); the
          # `locked`/`ultra` exemptions are conditional on the leg's feature set.
          # `--skip timing` and libtest's `filtered` field are handled per target, not by an
          # "any 0/0/0/0 line fails" rule.
          #
          # Parse by *field position*; matching `'… 0 ignored; 0 filtered out'` as one literal
          # never fires, because libtest always prints `0 measured;` between those fields.
          # Strip ANSI colour and carriage returns first: cargo colours `Running` when it
          # thinks it is on a terminal, and a CI log is a pipe that may still carry the
          # escapes (measured: an ANSI-wrapped `Running` line does not match an anchored
          # pattern while the plain `test result:` line does, so every summary looked
          # unattributable and every leg failed).
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g; s/\r$//' "$log" > "$RUNNER_TEMP/cargo-test-clean.log"
          # One definition, used by the real log and by the positive control below.
          # A separate inline awk in the control can pass while the real parser stops
          # matching, which is the failure this control exists to catch.
          zero_scan() {
            awk '
              /^[[:space:]]*Running / {
                target = ""
                for (k = 1; k <= NF; k++) if ($k ~ /\.rs$/) { target = $k; break }
                next
              }
              /^[[:space:]]*Doc-tests / { target = "doc-tests"; next }
              /^test result:/ {
                p = $4 + 0; f = $6 + 0; i = $8 + 0; x = $12 + 0
                if (p == 0) {
                  if (target == "") target = "<unattributed>"
                  printf "%s\t%d\t%d\t%d\n", target, p, i, x
                  n++
                }
              }
              END { exit (n > 0) ? 0 : 1 }
            ' "$1"
          }
          zero_scan "$RUNNER_TEMP/cargo-test-clean.log" > "$RUNNER_TEMP/zero-targets.txt" || true
          if [ -s "$RUNNER_TEMP/zero-targets.txt" ]; then
            bad=0
            while IFS=$'\t' read -r target p i x; do
              case "$target" in
                # `doc-tests` is the rustdoc harness: in the feature configurations that
                # compile out the one example that runs (and in every leg but the default,
                # measured), it legitimately has nothing to run. A doctest cannot be
                # "silently emptied" the way a test file can -- it *is* the source text.
                doc-tests)
                  echo "note: the doctest harness reported no runnable examples in this configuration" ;;
                # `tests/timing.rs` is excluded from this step by `--skip timing`, and libtest
                # reports that as `0 tests` rather than as `filtered` (measured), so the target
                # is legitimately empty here. It has its own blocking presence check and its own
                # advisory run in the `timing` job; the strict screens run in `verify.sh` 3c.
                tests/timing.rs)
                  echo "note: tests/timing.rs is skipped in this step by --skip timing and runs in the timing jobs" ;;
                # `tests/ctgrind.rs` is all `#[ignore]`d outside the static valgrind build,
                # so a zero-passed summary is legitimate here and the static configuration is
                # the one that checks it. Require the five ignored tests to still be there:
                # deleting the file's tests would otherwise also produce a zero-passed
                # summary, which is exactly the vacuous case this guard exists for.
                tests/ctgrind.rs)
                  if [ "${i:-0}" -lt 5 ]; then
                    echo "::error::tests/ctgrind.rs reported 0 passed but only $i ignored tests; the valgrind tests were removed or filtered out"
                    bad=1
                  else
                    echo "note: tests/ctgrind.rs is valgrind-only; $i ignored tests are still present"
                  fi ;;
                # `tests/locked.rs` and `tests/ultra.rs` are whole-file `#![cfg(feature)]`
                # gates. A zero-passed summary is legitimate only in a leg that does *not*
                # enable the gating feature; in the leg that turns it on -- including through
                # `ultra`, which implies `locked` -- zero passed is the regression this guard
                # exists to catch, and `ignored` does not excuse it.
                tests/locked.rs)
                  case "$test_args" in
                    *locked*|*ultra*|*all-features*)
                      echo "::error::tests/locked.rs reported 0 passed (ignored $i, filtered $x) in a leg that enables locked ($test_args)"
                      bad=1 ;;
                    *) echo "note: tests/locked.rs is empty because this leg does not enable locked" ;;
                  esac ;;
                tests/ultra.rs)
                  case "$test_args" in
                    *ultra*|*all-features*)
                      echo "::error::tests/ultra.rs reported 0 passed (ignored $i, filtered $x) in a leg that enables ultra ($test_args)"
                      bad=1 ;;
                    *) echo "note: tests/ultra.rs is empty because this leg does not enable ultra" ;;
                  esac ;;
                # `src/lib.rs` is the crate's unit-test target: reporting nothing there means
                # the library lost every test, which is the vacuous case itself.
                "<unattributed>") echo "::error::a summary line could not be attributed to a test target -- the log format changed, so this guard proved nothing" ; bad=1 ;;
                *)
                  echo "::error::$target reported 0 passed (ignored $i, filtered $x): every test was removed, gated out, or marked #[ignore]"
                  bad=1 ;;
              esac
            done < "$RUNNER_TEMP/zero-targets.txt"
            [ "$bad" -eq 0 ] || exit 1
          fi
          # Every binary cargo ran must also have reported: a target that produced no summary
          # line at all was compiled and never executed.
          ran="$(grep -cE '^[[:space:]]+Running (unittests|tests/)' "$RUNNER_TEMP/cargo-test-clean.log" || true)"
          reported="$(grep -cE '^test result:' "$RUNNER_TEMP/cargo-test-clean.log" || true)"
          if [ "${reported:-0}" -lt "${ran:-0}" ]; then
            echo "::error::cargo ran ${ran} test binaries but only ${reported} reported a result"
            exit 1
          fi
          echo "cargo test: ${ran} test binaries ran and reported (${reported} result lines, doc-tests included)"
          # Positive control, in the same step: the guard must reject a summary that reports
          # zero passed, including the all-ignored shape. Without this, it rots exactly the
          # way it just did -- a pattern that stops matching is indistinguishable from a
          # suite that is clean.
          vacuous="$(mktemp)"
          printf '     Running tests/vacuous.rs (target/debug/deps/vacuous)\ntest result: ok. 0 passed; 0 failed; 7 ignored; 0 measured; 0 filtered out\n' > "$vacuous"
          control="$(zero_scan "$vacuous" || true)"
          case "$control" in
            *"tests/vacuous.rs"*)
              echo "positive control: the real parser detects a 0-passed summary (even with ignored tests), so the guard can fail" ;;
            *)
              echo "::error::the zero-test parser did not detect a vacuous summary -- it cannot fail, so it proves nothing (output: $control)"
              exit 1 ;;
          esac
          rm -f "$vacuous"

  windows:
    name: windows (MSVC, all features)
    # The Windows assembly is selected by build.rs and was the platform on which
    # D-01's guard-page fault was first reproduced; no other job compiles it. The
    # `locked` tests skip on this platform by design, and `ultra` exercises the
    # witness and the non-Linux stubs.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows
      - name: cargo test (all features, release)
        run: cargo test --locked --release --all-features -- --skip timing
      - name: cargo check (no default features)
        run: cargo check --locked --no-default-features --all-targets

  blake3-c:
    name: vendored BLAKE3 C library
    # The C/assembly tree is shipped for C consumers and is no longer byte-identical
    # to upstream: the dispatch now splits SIMD groups and the unix compress
    # prologues zero-extend their narrow arguments. Run both the intrinsics and the
    # assembly test suites against the official vectors.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: C intrinsics tests (ASan/UBSan)
        working-directory: blake3/c
        run: |
          make -f Makefile.testing clean
          make -f Makefile.testing test
      - name: C assembly tests (ASan/UBSan)
        working-directory: blake3/c
        run: |
          make -f Makefile.testing clean
          make -f Makefile.testing test_asm

  no-std:
    name: no_std target (thumbv7em)
    # `--no-default-features --all-targets` on a host with std only proves the source
    # does not reference std directly; it does not build the dependency graph for a
    # target where std does not exist. This is the configuration the README calls
    # `no_std` support, so compile it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: no-std
      - name: cargo check
        run: cargo check --locked --no-default-features --lib --target thumbv7em-none-eabihf

  timing-instrument:
    name: timing instrument (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The split matters: the *instrument* is gated, the two leak *screens* are not.
    # `timing_screen_can_detect_a_real_difference` plants a ~67 ns/op difference and
    # requires the Welch t to see it (asserted `t > 10`). The measured t is host-dependent,
    # not a constant this comment can pin: t = 3244 on one runner, and ~1195 elsewhere,
    # where the same build resolved ~60 ns/op. What is fixed is the assertion against 10,
    # and that is what keeps the two screens from being vacuous -- no host bias can make
    # the instrument lie. Blocking, because a screen whose instrument has rotted is a
    # green check that means nothing, which is the failure mode this repository keeps
    # finding in other gates.
    #
    # The two leak screens themselves are deliberately *not* run here: on a hosted VM
    # their two classes are biased by ~0.8% with no possible cause (t = 10.96 release,
    # 11.89 debug, against a threshold of 10), and the fix for that is a quieter host,
    # not a weaker assertion. What is blocking is that they still *exist* in a release
    # build -- see the presence step below. They run strict in `./verify.sh` (stage 3c,
    # in the default invocation and under `--deep`/`--all`), and their advisory CI run
    # is the `timing` job below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: timing
      # A filter that matches nothing makes libtest print "test result: ok. 0 passed;
      # ... N filtered out" and *exit 0*, so a renamed or `#[cfg]`-ed-out test would
      # leave this step green while the instrument it gates was never exercised. This
      # job is blocking and is in the `release` job's `needs`, so the count in the
      # summary line is the only thing that says the filter matched; require it, the
      # same way every filtered Miri step in deep.yml and verify.sh's `--miri` stage
      # does.
      - name: the screen can detect a real difference
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          cargo test --locked --release --test timing -- timing_screen_can_detect_a_real_difference \
            2>&1 | tee "$work/timing-instrument.log"
          count="$(grep -E 'test result:' "$work/timing-instrument.log" | tail -1 \
            | sed -n 's/.* \([0-9][0-9]*\) passed.*/\1/p' || true)"
          if [ -z "$count" ] || [ "$count" -lt 1 ]; then
            echo "::error::the timing-instrument filter matched ${count:-0} test(s); expected at least 1, so this step checked nothing"
            exit 1
          fi
          echo "timing instrument ran $count test(s)"

      # The two screens cannot be blocked on (see the job comment), but they can
      # *disappear* without any job noticing: a rename, an `#[ignore]`, or a `#[cfg]`
      # that compiles the release file down to the instrument alone turns the advisory
      # run below into a green screen testing less, and `--skip timing` in the test
      # matrix then skips nothing that matters. Listing is deterministic and costs one
      # already-built binary invocation, so the presence of all three release tests is
      # blocking here: one instrument and the two leak screens.
      - name: the two leak screens still exist in a release build
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          # Run the source-level guard itself. `--list` still names ignored tests, so the
          # list check below is necessary but not sufficient; the guard rejects an ignore
          # or cfg attribute on either screen (including cfg_attr spellings).
          cargo test --locked --release --test timing -- --exact timing_screens_are_present_and_not_ignored
          cargo test --locked --release --test timing -- --list | tee "$work/timing-list.log"
          for name in \
            timing_tag_position_screen_finds_no_gross_difference \
            timing_does_not_depend_on_key_contents; do
            if ! grep -q "^${name}: test$" "$work/timing-list.log"; then
              echo "::error::${name} is no longer listed by 'cargo test --release --test timing': a renamed, ignored or cfg'd-out leak screen would leave the advisory job green while testing less"
              exit 1
            fi
          done
          echo "both leak screens are present in the release timing target"

  timing:
    name: timing screen (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Allowed to fail, and the reason is measured rather than convenient. This
    # screen compares two input classes whose work is identical, so anything it
    # reports on a shared runner is noise until shown otherwise: a *real* order
    # artefact in this harness measured t = 35.6, while two CI runs with no
    # possible cause reported t = 10.96 (release) and t = 11.89 (debug). Those
    # runs were not short of precision (5.72 ns/op release, 60.55 ns/op debug, per
    # tests/timing.rs:30-31; an earlier revision of this comment said 41 ns/op, which
    # matches neither) -- they were biased by ~0.8%
    # between the classes, which is what a hosted VM does. A 3x window between
    # noise and signal cannot be gated on, so the two leak screens are advisory --
    # the instrument they rest on is blocked by `timing-instrument` above, the
    # deterministic constant-time evidence is `tools/ctgrind.sh` (and
    # `tools/cache_profile.sh`) in Deep checks, and these same tests run strictly in
    # `./verify.sh` (its stage 3c, run by the default invocation as well as
    # `--deep`/`--all`), where a quiet machine reports t < 0.4.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: timing

      # Release, because the target is `#![cfg(not(debug_assertions))]`.
      - name: timing screen
        run: cargo test --locked --release --test timing

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the `rust-version` in Cargo.toml. Keep the two in step: the
      # whole point of this job is that the declared MSRV is *enforced*, not
      # merely stated. An unverified `rust-version` is a claim that can silently
      # become false -- the code can start using a newer API and nothing notices
      # until someone on an old toolchain tries to build it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: msrv

      # `--all-features` so the `rng` feature's dependency chain is covered too:
      # a transitive dependency can raise the real MSRV above this crate's own.
      #
      # `--skip timing` for the same reason the blocking matrix below uses it: the
      # statistical timing screen is advisory by measurement (a hosted VM reports
      # t ~ 11 with no possible cause, against a threshold of 10), so it must not
      # gate a job whose subject is the minimum toolchain.
      - name: build and test at the declared MSRV
        run: cargo test --locked --release --all-features -- --skip timing

      # Deliberately NOT running clippy here. An MSRV is a statement about the
      # language and library API surface, which is what building and testing
      # checks. Clippy's lint set is version-specific -- 1.85 both flags things
      # 1.98 accepts (e.g. `needless_range_loop` on loops that index two arrays
      # with one counter) and rejects as `unknown_lints` attributes that 1.98
      # understands (e.g. `clippy::manual_is_multiple_of`, which did not exist
      # yet in 1.85). Making the source warning-free under both would pin it to
      # the older clippy's opinions for no benefit.
      #
      # MSRV *compatibility* is still enforced, by the modern clippy in the
      # `lint` job: `clippy::incompatible_msrv` reads `rust-version` from
      # Cargo.toml and rejects any use of an API newer than it. That is the lint
      # that caught the real defect this job was added alongside.
      #
      # If this job fails because a dependency raised its MSRV, the fix is to
      # bump `rust-version` to the smallest version that works -- and to update
      # the `uses:` line above to match.

  cross:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64: the NEON backend is compiled for these targets. The -musl
          # variant is the one that is actually built and executed in the
          # `cross-exec` job below; here it is only type-checked.
          - target: aarch64-unknown-linux-gnu
            mode: check
          - target: aarch64-unknown-linux-musl
            mode: check
          # riscv64 has no SIMD backend at all, so this is the only target that
          # type-checks the scalar-only configuration. It is also linked and
          # executed in the `cross-exec` job below (with the link flags that job
          # sets), so this entry is the cheap half of the same coverage.
          - target: riscv64gc-unknown-linux-musl
            mode: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: cross-${{ matrix.target }}

      - name: cargo check
        run: cargo check --locked --target ${{ matrix.target }} --all-targets --all-features

  # Cross-architecture execution. aarch64 is the only place the NEON backend
  # runs at all (it is compiled out on x86), and i686 is the only place the
  # 32-bit code paths run (`usize` is 32 bits, so `check_lengths` and every
  # length arithmetic take a different route). A type-check says nothing about
  # either, so both are executed here.
  cross-exec:
    name: execute ${{ matrix.target }} suite under qemu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            qemu: qemu-aarch64
          - target: i686-unknown-linux-musl
            qemu: qemu-i386
          - target: powerpc64-unknown-linux-musl
            qemu: qemu-ppc64
          # The scalar-only configuration, on 64-bit RISC-V.  It needs the extra
          # link flags the build step sets below; `.cargo/config.toml` has the
          # full account, including why the getrandom weak symbol is forced.
          - target: riscv64gc-unknown-linux-musl
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: cross-exec-${{ matrix.target }}

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
          ${{ matrix.qemu }} --version

      # Mirrors stage 5 of ./verify.sh, which is the local entry point for the
      # same check. The test binaries are invoked directly rather than through
      # `cargo test --target`, so the emulator is used explicitly and a runner
      # misconfiguration cannot silently execute the target code natively.
      # `--features pure` because BLAKE3's build script compiles C kernels for
      # x86_64/aarch64 by default and needs a *target* C toolchain to do it; the
      # Rust backends need nothing. BLAKE3's backend is irrelevant to what this
      # job tests (the crate's own SIMD code), and the wire format is identical
      # either way -- the KATs and the equivalence corpus pin it.
      # ppc64 and riscv64 need no cross toolchain: rust-std ships the self-contained
      # crt objects and musl's libc, so rust-lld can link them.  Each needs an alias
      # for `libgcc_s.a` (the unwinder ships as `libunwind.a`) and a non-PIE
      # relocation model (the shipped `libc.a` is non-PIC).  riscv64 additionally
      # needs `-C link-self-contained=yes` -- without it the link still succeeds but
      # produces an entry point of 0, a segfault before the first syscall -- and
      # `--undefined=getrandom`, because that symbol is declared weak and would
      # otherwise stay unresolved, which on riscv64 turns the getrandom call into a
      # branch to itself.  `.cargo/config.toml` has the full account.
      - name: extra setup for the self-contained-musl targets
        if: matrix.target == 'powerpc64-unknown-linux-musl' || matrix.target == 'riscv64gc-unknown-linux-musl'
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          alias_dir="$HOME/.local/share/xsiv-cross"
          mkdir -p "$alias_dir"
          case "${{ matrix.target }}" in
            powerpc64-unknown-linux-musl)
              ln -sf "$sysroot/lib/rustlib/powerpc64-unknown-linux-musl/lib/self-contained/libunwind.a" "$alias_dir/libgcc_s.a"
              {
                echo "CARGO_TARGET_POWERPC64_UNKNOWN_LINUX_MUSL_LINKER=$sysroot/lib/rustlib/$host/bin/rust-lld"
                echo "CARGO_TARGET_POWERPC64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker-flavor=ld.lld -C link-self-contained=yes -C relocation-model=static -L native=$alias_dir"
              } >> "$GITHUB_ENV"
              ;;
            riscv64gc-unknown-linux-musl)
              ln -sf "$sysroot/lib/rustlib/riscv64gc-unknown-linux-musl/lib/self-contained/libunwind.a" "$alias_dir/libgcc_s.a"
              {
                echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker-flavor=ld.lld -C link-self-contained=yes -C relocation-model=static -C link-arg=--undefined=getrandom -L native=$alias_dir -L native=$sysroot/lib/rustlib/riscv64gc-unknown-linux-musl/lib/self-contained"
              } >> "$GITHUB_ENV"
              ;;
          esac
      # The list of binaries this build produced is captured, not guessed: `deps/` also
      # holds artifacts from earlier feature configurations (`Swatinem/rust-cache` restores
      # `target/`), and running those executes stale code. Measured locally: three such
      # binaries failed with counts from an older revision of their own tests, which reads
      # as "the cross target is broken" and is not.
      # `--features ultra,pure`: `pure` because BLAKE3's build script compiles C kernels
      # for x86_64/aarch64 and needs a *target* C toolchain to do it, while this job exists
      # to run *this crate's* code; `ultra` because it is the configuration with the most
      # code in it and the parts of it that are architecture-sensitive -- the
      # `from_le_bytes`/`to_le_bytes` conversions on every ChaCha20 and BLAKE3 word, 64-bit
      # chunk counters and lengths on a 32-bit `usize` -- are only reachable there. Leaving
      # `ultra` out meant the only architecture-dependent code in the crate was the only
      # code never executed on another architecture.
      - name: build ${{ matrix.target }} test binaries
        run: |
          set -euo pipefail
          # Both files live in `$RUNNER_TEMP`, not in the checkout: they are byproducts of
          # this step, and writing them into the working tree once put a `build.log` and an
          # `executables.txt` (with this host's paths) into the repository, where a later
          # `git add -A` committed them. `$RUNNER_TEMP` also survives between the steps of
          # this job, which is what the execute step needs.
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          # Three details, all of which made this step fail on every target from the commit
          # that introduced the parse until this one -- while `verify.sh`'s copy of the same
          # code worked locally, which is why it took a failing CI run to find:
          #
          #   * `2>&1`, because cargo writes "*Executable*" to **stderr** (only the test
          #     binaries' own output goes to stdout), so `| tee build.log` captured an empty
          #     file. Locally the pipeline had the redirect already.
          #   * `CARGO_TERM_COLOR=never`, because the workflow sets `always` at the top
          #     level and cargo then colours those same lines even through a pipe.
          #   * the `sed` expression itself: this file carried `\\(` and `\\1`, which reach
          #     `sed` as an escaped backslash -- a *literal* backslash in the pattern, which
          #     the line never contains. `verify.sh` has the single-backslash form and works.
          #
          # The `grep -q` guards are what would have caught all three: a parse that matches
          # nothing is not the same as a build that produced nothing, and "count > 0" accepts
          # any non-empty parse, including a wrong one.
          CARGO_TERM_COLOR=never cargo test --locked --target ${{ matrix.target }} --release \
            --no-run --features ultra,pure 2>&1 | tee "$work/build.log"
          sed -n 's/^ *Executable .*(\(.*\))$/\1/p' "$work/build.log" > "$work/executables.txt"
          count="$(grep -c . "$work/executables.txt" || true)"
          [ "$count" -gt 0 ] || { echo "cargo reported no executables" >&2; exit 1; }
          grep -q 'xchacha20_blake3_siv-' "$work/executables.txt" \
            || { echo "the parse did not find the library test binary -- check the sed" >&2; exit 1; }
          grep -q 'differential_reference-' "$work/executables.txt" \
            || { echo "the parse did not find the differential binary -- check the sed" >&2; exit 1; }
          echo "built $count test binaries"
          cat "$work/executables.txt"

      - name: execute under qemu
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          ran=0
          # Every test binary the build produced, not a hand-listed few. The list used to
          # name four (`xchacha20_blake3_siv-*`, `differential_reference-*`, `security-*`,
          # `threads-*`), which left `counter_range`, `decision`, `decision_scope`,
          # `locked`, `ultra` and `variable_latency` built but never executed on the cross
          # targets -- including `counter_range`, whose 32-bit assertions exist for the
          # i686 run, and `locked`, whose syscall numbers are per-architecture. The two
          # exclusions need something the emulator cannot provide: `timing-*` a real clock,
          # `ctgrind-*` valgrind on x86_64.
          #
          # `security-*` is executed here, with `--skip timing` kept as a belt: the
          # statistical timing screen lives in `tests/timing.rs` (its binary is `timing-*`,
          # already excluded above), so the flag is currently a no-op -- but it costs
          # nothing and keeps this step correct if a timing test moves back into
          # `security.rs`, which is where it used to live.
          #
          # Each binary's output is kept and its summary line read: a target whose tests are
          # all `#[cfg]`-ed out prints "test result: ok. 0 passed; 0 failed; 0 ignored; 0
          # filtered out" and exits 0, which reads as success in the one job whose whole
          # point is *executing* the NEON, 32-bit and big-endian code. A binary cargo built
          # and ran must have run something; `ignored` counts, like the native test legs --
          # valgrind-only and deliberate-race tests are legitimately ignored, but nothing
          # run and nothing ignored is a target that tested nothing.
          #
          # `XSIV_ALLOW_UNOBSERVABLE_DUMP_FLAGS=1`, scoped to this emulated invocation:
          # measured on the reference host, `qemu-aarch64` does not synthesize the guest's
          # `VmFlags` in `/proc/self/smaps` (a successful `mlock`/`madvise` leaves it at
          # `rd wr mr mw`), so `locked`'s `unlocking_restores_core_dump_inclusion` cannot
          # observe `MADV_DODUMP` under emulation -- the *observation channel* is missing,
          # not the behaviour, and the call itself stays pinned against the shipped source
          # by `the_dump_advice_is_issued_on_the_right_range`. The test fails by default
          # when the channel is missing (a returned test prints `ok`, indistinguishable
          # from having observed the effect); with this consent it prints a loud
          # `SKIPPED [unlocking_restores_core_dump_inclusion]: ...` line naming itself and
          # the variable, so the gap is still visible in the log.
          while IFS= read -r bin; do
            case "$(basename "$bin")" in timing-*|ctgrind-*) continue ;; esac
            extra=()
            case "$(basename "$bin")" in security-*) extra=(--skip timing) ;; esac
            echo "--- $(basename "$bin") ---"
            log="$work/qemu-$(basename "$bin").log"
            if ! XSIV_ALLOW_UNOBSERVABLE_DUMP_FLAGS=1 ${{ matrix.qemu }} "$bin" --test-threads=1 ${extra[@]+"${extra[@]}"} 2>&1 | tee "$log"; then
              echo "FAILED: $(basename "$bin") exited non-zero under ${{ matrix.qemu }}" >&2
              exit 1
            fi
            result="$(grep -E 'test result:' "$log" | tail -1 || true)"
            passed="$(printf '%s' "$result" | sed -n 's/.* \([0-9][0-9]*\) passed.*/\1/p')"
            ignored="$(printf '%s' "$result" | sed -n 's/.* \([0-9][0-9]*\) ignored.*/\1/p')"
            if [ -z "$passed" ] || [ -z "$ignored" ] || [ $((passed + ignored)) -eq 0 ]; then
              echo "::error::a test binary reported ${passed:-no} passed and ${ignored:-no} ignored test(s) under qemu: it was built and executed nothing (all its tests were compiled away, filtered out, or it printed no libtest summary)"
              exit 1
            fi
            ran=$((ran + 1))
          done < "$work/executables.txt"
          if [ "$ran" -eq 0 ]; then
            echo "no ${{ matrix.target }} test binaries were executed (executables.txt was empty or all entries were excluded)" >&2
            exit 1
          fi
          echo "executed $ran ${{ matrix.target }} test binaries under qemu"

  differential:
    name: differential fixture vs reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: install the blake3 module
        run: python3 -m pip install --quiet "blake3==1.0.11"

      # The reference implementation self-checks against the published RFC 8439,
      # HChaCha20 and c2sp.org vectors before it emits anything, so a failure
      # here means the reference itself is wrong, not merely that it disagrees.
      - name: reference implementation self-checks
        run: python3 tools/ref_impl.py

      # Fails if the committed fixture no longer matches what the reference
      # produces, i.e. if someone edited a KAT by hand or changed the
      # construction without regenerating.
      - name: committed fixture is current
        run: python3 tools/gen_test_vectors.py --check

  stack-residue:
    name: stack residue (blocking, every build)
    runs-on: ubuntu-latest
    # Every build now calls `scrub_stack`; the tool scans for the master key,
    # the locked integrity tag, and the derived k_in/k_out/enc_seed/enc_key/enc_nonce
    # values independently. A residue report is a release blocker. The scan has
    # positive controls for the shapes its thresholds cover, so a layout change that
    # moves a value is reported as a finding rather than silently passing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Default build: a report fails this step and the job. The tool checks the master
      # key, the locked integrity tag, and the derived k_in/k_out/enc_seed/enc_key/
      # enc_nonce patterns; its own positive controls must fire first. A layout change
      # that moves a value is therefore a release blocker rather than a warning.
      - name: default build
        run: |
          set +e
          tools/stack_residue.sh | tee "$RUNNER_TEMP/residue-default.log"
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "default build: no key or derived-value run at or above the tool's thresholds" ;;
            1) if grep -qE '^FAIL: the .*positive control' "$RUNNER_TEMP/residue-default.log"; then
                 echo "::error::stack_residue.sh's own positive control did not take, so the default build's measurement is void: $(grep -E '^FAIL' "$RUNNER_TEMP/residue-default.log" | head -2 | tr '\n' ' ')"
               else
                 echo "::error::stack_residue.sh reported residue in the default build: $(grep -E ' \| (KEY|DERIVED) RESIDUE: ' "$RUNNER_TEMP/residue-default.log" | head -3 | tr '\n' ' ')"
               fi
               exit "$rc" ;;
            *) # 3 is "could not run" -- the repository's convention, and a *skipped stage* in
               # verify.sh. It is still an error here, because this step exists to produce the
               # measurement and an absent measurement reported as a passed step is how a check
               # stops being a check. The job stays advisory, so this blocks nothing.
               echo "::error::stack_residue.sh exited $rc in the default build: no measurement was produced (3 = could not run)"; exit "$rc" ;;
          esac

      # `ultra`: the same scrub plus the witness. A report here fails the step exactly
      # like the default build's.
      - name: ultra build
        run: |
          set +e
          tools/stack_residue.sh --ultra | tee "$RUNNER_TEMP/residue-ultra.log"
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "ultra build: no key or derived-value run at or above the tool's thresholds" ;;
            1) if grep -qE '^FAIL: the .*positive control' "$RUNNER_TEMP/residue-ultra.log"; then
                 echo "::error::stack_residue.sh's own positive control did not take, so the ultra build's measurement is void: $(grep -E '^FAIL' "$RUNNER_TEMP/residue-ultra.log" | head -2 | tr '\n' ' ')"
               else
                 echo "::error::stack_residue.sh reported residue in the ultra build, where scrub_stack is supposed to erase it: $(grep -E ' \| KEY RESIDUE: ' "$RUNNER_TEMP/residue-ultra.log" | head -3 | tr '\n' ' ')"
               fi
               exit "$rc" ;;
            *) echo "::error::stack_residue.sh exited $rc in the ultra build: no measurement was produced (3 = could not run)"; exit "$rc" ;;
          esac

  supply-chain:
    name: dependency advisories and licences
    # A release is a statement about the committed dependency tree, so the audit and the
    # licence/source policy must pass for the same commit. They also run in Deep checks,
    # but that workflow is scheduled/dispatched and does not gate a push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit the dependency tree
        run: cargo audit --deny warnings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check

  release:
    name: tag the commit and publish a release
    # Gate on every verification job: a release must not exist for a commit that
    # did not pass. `needs` also means a failure anywhere blocks this.
    #
    # `timing-instrument` is in the list because it is *blocking* (no
    # `continue-on-error`) and was previously omitted, so a commit whose timing
    # instrument had rotted could still cut a release -- contradicting this comment.
    # `stack-residue` is blocking and is a gate. The statistical `timing` job remains
    # advisory (host noise), while its instrument is a separate blocking job.
    needs: [lint, test, windows, blake3-c, no-std, msrv, cross, cross-exec, differential, timing-instrument, stack-residue, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the generated notes can be compared against the
          # previous release.
          fetch-depth: 0
          # This job has `contents: write` for the release API only. A persisted
          # credential would put that token in `.git/config` while every build
          # script (including the vendored BLAKE3 build.rs and registry crates)
          # runs. No step here pushes over git.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Same-commit Deep and Formal success is part of the release gate. They are
      # separate workflows (their runtimes are long), so `needs` cannot express this;
      # poll the workflow-run API for this exact SHA and refuse to publish until both
      # have completed successfully. A failure or a timeout blocks the release.
      - name: require same-commit Deep and Formal success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 240*60 ))
          while :; do
            deep="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Deep checks")][0] | "\(.status) \(.conclusion // "")"' || true)"
            formal="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Formal verification")][0] | "\(.status) \(.conclusion // "")"' || true)"
            echo "Deep: ${deep:-missing}; Formal: ${formal:-missing}"
            case "$deep" in
              "completed success") ;;
              completed\ *)
                echo "::error::Deep checks did not succeed on $GITHUB_SHA ($deep)"; exit 1 ;;
            esac
            case "$formal" in
              "completed success") ;;
              completed\ *)
                echo "::error::Formal verification did not succeed on $GITHUB_SHA ($formal)"; exit 1 ;;
            esac
            if [ "$deep" = "completed success" ] && [ "$formal" = "completed success" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for Deep/Formal on $GITHUB_SHA"; exit 1
            fi
            sleep 30
          done

      # Every release has three configurations, and this step is what makes that a
      # claim rather than a hope. Features are compile-time, so "three versions" for a
      # library means three *supported configurations*, each built here, each tested by
      # a named leg of the `test` matrix, and each described in the artifact attached
      # below:
      #
      #   * `opt-out`   --release --no-default-features
      #   * `hardened`  --release                          (the default)
      #   * `ultra`     --release --features ultra
      #
      # Two things are checked. First, the three build *in this job*, from the same
      # commit the release is cut from: the matrix proved they pass their tests, this
      # proves they are buildable in the release environment too. Second, the `test`
      # matrix still names all three -- `needs: [test]` only means something while those
      # legs exist, and a matrix entry dropped in a refactor would otherwise take a
      # configuration out of the gate silently. The same idea as the source-shape tests
      # in `tests/`, applied to the workflow itself.
      - name: build the three configurations, and prove the matrix still names them
        run: |
          set -euo pipefail
          cargo build --locked --release --no-default-features
          cargo build --locked --release
          cargo build --locked --release --features ultra
          # The `- ` prefix *and* the `$` anchor are both load-bearing, not cosmetic.
          # Without them the search string matches *this loop's own literals* on the
          # lines above (so the grep always succeeds and the guard can never fire --
          # measured: deleting a leg from the matrix still printed "matrix leg present"),
          # and without the anchor `- profile: release, no default features` also matches
          # the longer `- profile: release, no default features with rng` row. A matrix
          # row is exactly `- profile: ...`; anchoring both ends makes the check mean what
          # it says. (Same class as the other vacuous gates this repo has found: a check
          # that cannot fail reads as a pass.)
          for leg in 'profile: release, default features' \
                     'profile: release, no default features' \
                     'profile: release, ultra'; do
            # The line must start with list indentation then `- `; an unanchored
            # substring match accepts `          # - profile: ...`, which is exactly
            # how a commented-out matrix row would sail through this gate.
            if ! grep -qE "^[[:space:]]*- ${leg}\$" .github/workflows/ci.yml; then
              echo "::error::the test matrix no longer contains a '- $leg' entry, so this release would not be gated on that configuration"
              exit 1
            fi
            echo "matrix leg present: - $leg"
          done

      # One artifact per configuration, not one artifact for the default and prose about the
      # others. The library is feature-agnostic -- what a consumer gets depends on the
      # features *they* enable -- so the three configurations are only "shipped" if each has
      # something a user can take away and use, and if the release itself demonstrates what
      # the three have in common.
      #
      # Each bundle carries the compiled library for that configuration, a runnable binary
      # (`xsiv_stdin`), the input vector it was run on, and a manifest with the exact build
      # command, the resolved feature set, the file digests, and the known-answer output. The
      # last of those is also the cross-check
      # between configurations: **the same vector through all three must produce the same
      # ciphertext and tag byte for byte**, and the step fails if they differ. That is the release
      # proving the claim "identical bytes, different defences" rather than asserting it.
      - name: package one artifact per configuration
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=12 HEAD)"
          mkdir -p dist
          digests="${RUNNER_TEMP:-/tmp}/rlib-digests.txt"
          : > "$digests"

          # A fixed vector, run through the crate's own audit CLI: one line of four
          # space-separated hex fields (`key_hex nonce_hex aad_hex msg_hex`, see the example's
          # header). The message crosses ChaCha20's 64-byte block so the ciphertext needs two
          # blocks, and the AAD is non-empty. (`-` would be the empty field, per that header.)
          cat > dist/vector.txt <<'VEC'
          000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f 000102030405060708090a0b0c0d0e0f1011121314151617 616164 4d657373616765206c6f6e676572207468616e206f6e6520436861436861323020626c6f636b2c20736f20746865206b657973747265616d20636f6e74696e7565732e
          VEC

          first_kat=""
          for cfg in opt-out hardened ultra; do
            case "$cfg" in
              opt-out)  flags="--no-default-features" ;;
              hardened) flags="" ;;
              ultra)    flags="--features ultra" ;;
            esac
            echo "=== bundling $cfg ($flags) ==="
            # `--lib` is required, not incidental. Building *only* the example does not
            # regenerate the root `target/release/libxchacha20_blake3_siv.rlib`: that
            # artifact is uplifted only when the lib target is built. Measured on this
            # workflow before the fix: after `cargo build --release --no-default-features
            # --example xsiv_stdin` the root rlib still had the feature set of the last
            # plain `cargo build` (the `ultra` one, three steps earlier), so all three
            # bundles shipped the same `ultra` library while their manifest claimed "the
            # compiled library for this configuration" -- and the three `.rlib` digests in
            # the per-bundle tables would have been identical. With `--lib` each iteration
            # rewrites the root rlib to the matching feature set: the three digests are
            # then distinct (verified by running this loop locally).
            # Remove any previous root rlib first: if cargo leaves a stale metadata-hashed
            # artifact in target/release, `ls | head -1` would digest the wrong build.
            rm -f target/release/libxchacha20_blake3_siv*.rlib
            cargo build --locked --release $flags --lib --example xsiv_stdin
            bin="target/release/examples/xsiv_stdin"
            rlib="$(ls target/release/libxchacha20_blake3_siv*.rlib | head -1)"
            # Capture the digest of the rlib produced by this iteration. The three
            # configurations must not ship the same binary: the regression this guards
            # against is a missing `--lib` leaving the previous configuration's rlib in
            # place, which the KAT equality check cannot see.
            sha256sum "$rlib" | cut -d' ' -f1 >> "$digests"

            name="xsiv-${short}-${cfg}"
            mkdir -p "dist/$name"
            cp "$bin" "dist/$name/xsiv_stdin"
            cp "$rlib" "dist/$name/$(basename "$rlib")"
            # Ship the input the KAT is the answer for, so a consumer can re-derive it
            # instead of taking the bundled digest on faith.
            cp dist/vector.txt "dist/$name/vector.txt"

            # The known-answer output for this configuration, and the cross-configuration check.
            "$bin" < dist/vector.txt > "dist/$name/kat.txt"
            # A guard earned by a local dry run: with the vector in the wrong format the CLI
            # panicked and wrote *nothing*, and all three configurations "matched" — on the hash
            # of an empty file. Same bytes for the worst possible reason. So an empty or
            # unterminated output is a failure here, before any hash is compared.
            if [ ! -s "dist/$name/kat.txt" ]; then
              echo "::error::$cfg produced no known-answer output at all; the vector is probably malformed (see the example's header for the field format)"
              exit 1
            fi
            if ! grep -qE '^[0-9a-f]+ [0-9a-f]+$' "dist/$name/kat.txt"; then
              echo "::error::$cfg's known-answer output is not a '<ciphertext_hex> <tag_hex>' line:"
              cat "dist/$name/kat.txt" >&2
              exit 1
            fi
            kat="$(sha256sum < "dist/$name/kat.txt" | cut -d' ' -f1)"
            if [ -z "$first_kat" ]; then
              first_kat="$kat"
              echo "  kat sha256: $kat (reference for the other two)"
            elif [ "$kat" != "$first_kat" ]; then
              echo "::error::$cfg produced different ciphertext/tag for the same vector ($kat vs $first_kat): the wire format is NOT identical across configurations, and the release notes must not say it is"
              # Print all three outputs side by side. `diff <(cat dist/*/kat.txt)` looked
              # like a comparison but passed a single operand to `diff`, which printed
              # "missing operand" and exited 2 -- swallowed by `|| true`, so the one
              # failure path that matters showed nothing useful.
              echo "per-bundle known-answer output:" >&2
              for f in dist/*/kat.txt; do printf '%s: ' "$f" >&2; cat "$f" >&2; done
              exit 1
            else
              echo "  kat sha256: $kat (identical to the opt-out bundle)"
            fi

            {
              echo "# XChaCha20-BLAKE3-SIV -- $cfg bundle"
              echo
              echo "Commit: ${GITHUB_SHA} (${short})"
              echo "Configuration: **$cfg**"
              echo "Built with: \`cargo build --release ${flags}\` (rustc $(rustc --version | cut -d' ' -f2))"
              echo
              echo "## Contents"
              echo
              echo "| File | What it is |"
              echo "| --- | --- |"
              echo "| \`xsiv_stdin\` | the crate's audit CLI, built for this configuration |"
              echo "| \`libxchacha20_blake3_siv*.rlib\` | the compiled library for this configuration, **for inspection** — an \`rlib\` is not self-contained: linking it needs the same toolchain and the same dependency \`rlib\`s. The supported way to use this crate is the repository source tree (it carries the maintained \`blake3/\` fork), with the features you want |"
              echo "| \`kat.txt\` | the known-answer output for \`vector.txt\` in this configuration |"
              echo "| \`vector.txt\` | the input \`kat.txt\` is the answer for — one line, four space-separated hex fields (\`key nonce aad msg\`), the format \`xsiv_stdin\` reads on stdin |"
              echo
              echo "## Digests"
              echo
              echo '```'
              (cd "dist/$name" && sha256sum xsiv_stdin *.rlib kat.txt vector.txt)
              echo '```'
              echo
              echo "## Known-answer output"
              echo
              echo "Same vector, same bytes as the other two configurations: \`sha256(kat.txt) = $kat\`."
              echo
              echo '```'
              cat "dist/$name/kat.txt"
              echo '```'
              echo
              echo "## Features resolved in this build"
              echo
              echo '```'
              # `CARGO_TERM_COLOR=never`: `CARGO_TERM_COLOR=always` is set for the
              # workflow, and raw ANSI escapes in a released README are not markdown.
              # `sed -n '1,20p'` reads the whole pipe (unlike `head`, which can give cargo
              # SIGPIPE under `pipefail`) and still caps the quote at 20 lines.
              CARGO_TERM_COLOR=never cargo tree --locked --edges normal $flags | sed -n '1,20p'
              echo '```'
              echo
              echo "See \`CONFIGURATIONS.md\` (also attached) for what each configuration adds and"
              echo "what it costs."
            } > "dist/$name/README.md"

            tar -czf "dist/$name.tar.gz" -C dist "$name"
            echo "  wrote dist/$name.tar.gz ($(stat -c%s "dist/$name.tar.gz") bytes)"
          done
          ls -l dist/*.tar.gz
          # Three configurations, three distinct compiled libraries. If a future edit
          # drops `--lib` (or reuses one build), the three bundles can still carry the
          # same rlib; the KAT is config-independent and would not catch it.
          if [ "$(sort -u "$digests" | wc -l)" -ne 3 ]; then
            echo "::error::the three configuration builds produced fewer than three distinct rlib digests:"
            cat "$digests"
            exit 1
          fi
          echo "three distinct rlib digests:" && cat "$digests"

      - name: write the configuration manifest
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=12 HEAD)"
          cat > target/CONFIGURATIONS.md <<EOF
          # The three configurations of this release

          Built and tested from commit \`${short}\`. Features are compile-time, so all three come
          from the *same source tree*; what differs is what the compiler includes.

          | Configuration | Cargo | What it adds |
          | --- | --- | --- |
          | \`opt-out\` | \`--no-default-features\` | Nothing: one accept/reject comparison. The fault-model boundary is the README's "What is not defended against" table. |
          | \`hardened\` (default) | \`--release\` | Two independently recomputed gates with separate branches, fail-closed, through \`subtle\`. |
          | \`ultra\` | \`--features ultra\` | Everything above plus the independent second implementation cross-checking the tag on both decrypt paths and on the allocating \`encrypt\` (the in-place \`encrypt_in_place_detached\` carries no cross-check — see README, "What the witness is"), two differently-written comparisons, and the \`locked\`/\`rng\`/\`dual-mac\` layers. |

          Each row is gated on a named leg of the \`test\` matrix at this commit
          (\`release, default features\`, \`release, no default features\`, \`release, ultra\`), plus the
          cross-target and qemu executions, the differential fixture against the independent
          reference, and the same-commit Formal verification and Deep checks are
          polled by the release job and must succeed before publication. The
          scheduled wide sweeps are a separate scheduled audit, not part of the
          push-time Deep run; they are not release gates.

          The wire format is **identical across the three**: the KATs, the differential fixture and
          the accelerated-path corpus pin the same bytes in every configuration, and this release
          carries a per-configuration bundle (\`xsiv-<commit>-<configuration>.tar.gz\`) with the
          compiled library, a runnable binary and that configuration's known-answer output, whose
          digest is the same in all three. What changes is
          the fault model and the cost; per-configuration performance against RustCrypto's
          \`chacha20poly1305\` is in \`performance.md\`.
          EOF
          cat target/CONFIGURATIONS.md

      # The tag is the commit, as requested: an immutable, unambiguous pointer
      # at exactly the tree that passed CI. A *moving* tag such as `latest`
      # would silently change what it points at, which is the wrong property for
      # a release of a cryptographic library.
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short="$(git rev-parse --short=12 HEAD)"
          tag="sha-${short}"

          # Expand the glob ourselves and refuse to publish an empty release.
          # Defensive rather than a fix for a known failure: an unexpanded glob
          # is silent, and an unattached artifact is easy to miss at the time.
          shopt -s nullglob
          # The configuration manifest is a *required* artifact: it is the statement that
          # this release is the three-configuration release, and a release that quietly
          # shipped without it would be the failure mode this whole step exists to stop.
          manifest=target/CONFIGURATIONS.md
          if [ ! -s "$manifest" ]; then
            echo "::error::$manifest is missing or empty; the configuration step did not run"
            exit 1
          fi
          # The per-configuration bundles are *required* artifacts for the same reason the
          # manifest is: a release that silently shipped only the default build would be the
          # failure this whole step exists to prevent.
          shopt -s nullglob
          # Source-only distribution: a `.crate` must never be produced or attached.
          # `publish = false` stops publishing, but not `cargo package`; this refuses
          # an artifact from any future packaging step before it reaches the release.
          crates=(dist/*.crate)
          if [ "${#crates[@]}" -ne 0 ]; then
            echo "::error::a .crate artifact was produced despite the source-only policy: ${crates[*]}"
            exit 1
          fi
          bundles=(dist/*.tar.gz)
          if [ "${#bundles[@]}" -ne 3 ]; then
            echo "::error::expected three configuration bundles in dist/, found ${#bundles[@]}: ${bundles[*]}"
            exit 1
          fi
          echo "artifacts to attach: ${manifest} ${bundles[*]}"

          # Idempotent in the strong sense: if the release already exists, attach
          # the artifact to it rather than reporting "nothing to do". This path is
          # not known to have been hit, but skipping the attach is the kind of
          # thing that would go unnoticed for a long time.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; uploading artifact"
            gh release upload "$tag" "$manifest" "${bundles[@]}" --clobber
            exit 0
          fi

          cat > notes.md <<EOF
          Snapshot of \`main\` at commit [\`${short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          **Three configurations, three artifacts.** Features are compile-time, so
          all three come from the same source tree; what differs is what the compiler
          includes. Each configuration ships as its own bundle —
          \`xsiv-${short}-opt-out.tar.gz\`, \`-hardened.tar.gz\`, \`-ultra.tar.gz\` — containing the
          compiled library, a runnable binary, the known-answer output and the resolved
          feature set for that configuration, with digests in each bundle's \`README.md\`.

          The three known-answer outputs are **byte-identical** (\`sha256\` of the tag and
          ciphertext for the same vector is the same in all three), which this job verifies
          before publishing rather than asserting here. Attached [\`CONFIGURATIONS.md\`](./CONFIGURATIONS.md)
          describes what each adds and what it costs:

          | | Cargo | Adds |
          | --- | --- | --- |
          | \`opt-out\` | \`--no-default-features\` | nothing (one comparison) |
          | \`hardened\` (default) | \`--release\` | two gates, independent recomputation, fail-closed |
          | \`ultra\` | \`--features ultra\` | + witness cross-check and the \`locked\`/\`rng\`/\`dual-mac\` layers |

          Each configuration is gated on its own leg of the CI test matrix at this commit.

          Gated by CI on this commit: formatting and lints clean, the full test
          suite green in release and debug, three cross-targets type-checked, the
          aarch64 (NEON), i686 (32-bit), powerpc64 (big-endian) and riscv64
          (scalar-only) suites executed under qemu, and the
          differential fixture
          re-checked against the independent reference implementation.

          The same-commit Formal verification and Deep checks are gates for this
          release: the release job polls their workflow runs for this SHA and
          refuses to publish unless both completed successfully. The scheduled
          wide sweeps are a separate scheduled audit and are not release gates.

          > **Wire format.** This construction is bespoke and not byte-compatible
          > with anything else: a two-level keyed-BLAKE3 65-byte tag over the
          > XChaCha20 nonce extension. The format changed twice on the way here
          > (v0.1 used Poly1305 with a 32-byte tag; v0.3 made the tag two-level) and
          > revision \`v0.3\` is now frozen: it will not change without an explicit
          > revision bump, not silently. The crate itself is pre-1.0, so its Rust API
          > may still move. See README.md for the construction and its security level.
          EOF

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "XChaCha20-BLAKE3-SIV ${short}" \
            --notes-file notes.md \
            --latest \
            "$manifest" "${bundles[@]}"
