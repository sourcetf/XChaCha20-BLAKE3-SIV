# Continuous integration: lint, test, cross-check, execute the cross-target suites,
# and re-check the differential fixture against the independent reference
# implementation.
#
# Once every job here passes on `main`, the `release` job tags the commit and
# publishes a release.  See .github/workflows/formal.yml for the Kani proofs,
# which are kept separate because they take far longer than everything here
# combined.
#
# Every `uses:` below is pinned to a full commit SHA with the moving tag in a
# comment, so the code CI executes is a fixed object rather than whatever a tag
# points at this week (an auditor raised this: the repository argues for
# reproducible builds and then ran unpinned third-party code on every push).
#
# The trade-off is real and it is paid for rather than ignored: pinning also
# means a security fix upstream does not arrive by itself. `.github/dependabot.yml`
# is the other half — it updates the SHA *and* the `# vX` comment beside it and
# opens a PR that CI validates, weekly, so the repository cannot silently sit on
# an old action. To do it by hand instead:
#   gh api repos/actions/checkout/commits/v7 --jq .sha
# (Relaxing to `@v7` would put the fix path back but hand the decision of *what
# runs here* to whoever can move that tag — which is the attack this pinning
# exists to close: in the release job, where the token has `contents: write`,
# that means the published `.crate` artifact. See the header of dependabot.yml.)
#
# One action needs care beyond the pin: `dtolnay/rust-toolchain` takes the
# toolchain's *name from its ref*, so a bare SHA pin would leave the nightly and
# 1.85.0 jobs resolving to whatever that SHA's branch happens to be — and when
# Dependabot groups a bump it replaces all three refs with the default branch's
# SHA at once, which is how it was found: the update PR's TSAN job failed with
# `rust-src` missing for the *stable* toolchain, because "nightly" had become
# stable. Measured on main's logs: the action does resolve the toolchain from the
# pinned SHA's branch, so the per-branch pins were right; the grouping is what
# breaks them. Fix: name the toolchain explicitly with `with: toolchain: …` at
# every use, which makes any SHA safe and keeps the updates flowing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes an in-flight run rather than queueing
# behind it -- but **only for pull requests**. On `main` a run carries the
# `release` job, which tags the commit and uploads the `.crate`, the manifest and
# the three bundles; `gh release create`/`upload` is not atomic, so superseding a
# main run mid-publish can leave a partially-populated release -- the exact
# outcome the publish step works to prevent. So pushes to `main` are not
# cancelled; they queue, and each publishes its own `sha-<commit>` tag, which is
# safe. (Found while auditing the release job: the unconditional
# `cancel-in-progress: true` reached the release too.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless in CI (nothing is reused between runs)
  # and only slow down the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint

      - name: cargo fmt
        run: cargo fmt --all --check

      # Both feature sets: `rng` gates a public module, so a warning there
      # would otherwise only surface once someone enabled the feature.
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The tools' contract: "could not run" is exit 3, never 0, and the caller that
      # invokes them reports it as a skipped stage. A gate that regresses to exit 0
      # here fails this step rather than a summary line somewhere else.
      - name: gate contract (a gate that could not run must not exit 0)
        run: ./tools/gate_selftest.sh

      # `src/proofs.rs` is `#[cfg(kani)]`, so nothing above compiles it -- a
      # signature change to an internal function breaks the Formal job with no
      # local symptom, which is what happened to `derive_enc` and took all four
      # Kani shards down. This type-checks the harnesses against no-op stand-ins
      # for Kani's attributes. It proves nothing; it catches the break.
      - name: Kani harnesses still compile (--cfg kani, no-op shim)
        run: ./tools/check_kani_cfg.sh

      # Catches broken intra-doc links, which are invisible to `cargo test`.
      - name: rustdoc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # `--no-default-features` is how a `no_std` user consumes this crate, and
      # nothing else exercises it. It was broken once: `zeroize` was an optional
      # dependency behind a default feature while the code used it
      # unconditionally, so the crate failed to build exactly where `no_std`
      # users would hit it. Cheap to check, so check it.
      - name: build with no default features
        run: cargo check --no-default-features --all-targets

      - name: cargo package
        run: cargo package

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: release, default features
            args: --release
          - profile: release, all features
            args: --release --all-features
          # Debug matters here beyond the usual reasons: `subtle`'s constant-time
          # guarantees are release-only (its Choice runs invariant checks in
          # debug), and this crate's own assertions and debug paths are only
          # exercised in a debug build.
          - profile: debug, all features
            args: --all-features
          # `ultra` is a first-class configuration, not a combination that happens to be
          # covered by `--all-features`: it must build and pass on its own, because that
          # is how a user enables it and how a regression in its feature wiring shows up.
          - profile: release, ultra
            args: --release --features ultra
          # The opt-out build, so the single-gate configuration keeps its own witness.
          - profile: release, no default features
            args: --release --no-default-features
          # `locked` is a feature a caller can turn on by itself, and it used to gate
          # nothing at all: the module was under `ultra`, so `--features locked` compiled
          # an empty feature. This entry is what keeps that from happening again.
          - profile: release, locked alone
            args: --release --features locked
          # `rng` alone, and the `no_std` shape of it (`--no-default-features --features
          # rng`): the feature adds a module and a dependency, and neither combination was
          # built anywhere.
          - profile: release, rng alone
            args: --release --features rng
          - profile: release, no default features with rng
            args: --release --no-default-features --features rng
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-${{ matrix.profile }}

      # `--skip timing` keeps `tests/timing.rs` out of the blocking run: on a
      # shared runner that screen cannot separate a real effect from a spurious
      # one (see the advisory `timing` job below for the measurements). Only that
      # target names its tests `timing_*`, so nothing else is affected.
      - name: cargo test
        run: cargo test ${{ matrix.args }} -- --skip timing

  timing-instrument:
    name: timing instrument (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The split matters: the *instrument* is gated, the two leak *screens* are not.
    # `timing_screen_can_detect_a_real_difference` plants a ~67 ns/op difference and
    # requires the Welch t to see it (asserted `t > 10`; measured t = 3244 on a
    # runner), so hosted-VM bias cannot make it lie -- and it is the assertion that
    # keeps the two screens from being vacuous. Blocking, because a screen whose
    # instrument has rotted is a green check that means nothing, which is the failure
    # mode this repository keeps finding in other gates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: timing
      - name: the screen can detect a real difference
        run: cargo test --release --test timing -- timing_screen_can_detect_a_real_difference

  timing:
    name: timing screen (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Allowed to fail, and the reason is measured rather than convenient. This
    # screen compares two input classes whose work is identical, so anything it
    # reports on a shared runner is noise until shown otherwise: a *real* order
    # artefact in this harness measured t = 35.6, while two CI runs with no
    # possible cause reported t = 10.96 (release) and t = 11.89 (debug). Those
    # runs were not short of precision (5.72 ns/op release, 60.55 ns/op debug, per
    # tests/timing.rs:30-31; an earlier revision of this comment said 41 ns/op, which
    # matches neither) -- they were biased by ~0.8%
    # between the classes, which is what a hosted VM does. A 3x window between
    # noise and signal cannot be gated on, so the two leak screens are advisory --
    # the instrument they rest on is blocked by `timing-instrument` above, the
    # deterministic constant-time evidence is `tools/ctgrind.sh` (and
    # `tools/cache_profile.sh`) in Deep checks, and these same tests run strictly in
    # `./verify.sh --deep`, where they report t < 0.4.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: timing

      # Release, because the target is `#![cfg(not(debug_assertions))]`.
      - name: timing screen
        run: cargo test --release --test timing

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the `rust-version` in Cargo.toml. Keep the two in step: the
      # whole point of this job is that the declared MSRV is *enforced*, not
      # merely stated. An unverified `rust-version` is a claim that can silently
      # become false -- the code can start using a newer API and nothing notices
      # until someone on an old toolchain tries to build it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv

      # `--all-features` so the `rng` feature's dependency chain is covered too:
      # a transitive dependency can raise the real MSRV above this crate's own.
      #
      # `--skip timing` for the same reason the blocking matrix below uses it: the
      # statistical timing screen is advisory by measurement (a hosted VM reports
      # t ~ 11 with no possible cause, against a threshold of 10), so it must not
      # gate a job whose subject is the minimum toolchain.
      - name: build and test at the declared MSRV
        run: cargo test --release --all-features -- --skip timing

      # Deliberately NOT running clippy here. An MSRV is a statement about the
      # language and library API surface, which is what building and testing
      # checks. Clippy's lint set is version-specific -- 1.85 both flags things
      # 1.98 accepts (e.g. `needless_range_loop` on loops that index two arrays
      # with one counter) and rejects as `unknown_lints` attributes that 1.98
      # understands (e.g. `clippy::manual_is_multiple_of`, which did not exist
      # yet in 1.85). Making the source warning-free under both would pin it to
      # the older clippy's opinions for no benefit.
      #
      # MSRV *compatibility* is still enforced, by the modern clippy in the
      # `lint` job: `clippy::incompatible_msrv` reads `rust-version` from
      # Cargo.toml and rejects any use of an API newer than it. That is the lint
      # that caught the real defect this job was added alongside.
      #
      # If this job fails because a dependency raised its MSRV, the fix is to
      # bump `rust-version` to the smallest version that works -- and to update
      # the `uses:` line above to match.

  cross:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64: the NEON backend is compiled for these targets. The -musl
          # variant is the one that is actually built and executed in the
          # `cross-exec` job below; here it is only type-checked.
          - target: aarch64-unknown-linux-gnu
            mode: check
          - target: aarch64-unknown-linux-musl
            mode: check
          # riscv64 has no SIMD backend at all, so this is the only target that
          # type-checks the scalar-only configuration. It is also linked and
          # executed in the `cross-exec` job below (with the link flags that job
          # sets), so this entry is the cheap half of the same coverage.
          - target: riscv64gc-unknown-linux-musl
            mode: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cross-${{ matrix.target }}

      - name: cargo check
        run: cargo check --target ${{ matrix.target }} --all-targets --all-features

  # Cross-architecture execution. aarch64 is the only place the NEON backend
  # runs at all (it is compiled out on x86), and i686 is the only place the
  # 32-bit code paths run (`usize` is 32 bits, so `check_lengths` and every
  # length arithmetic take a different route). A type-check says nothing about
  # either, so both are executed here.
  cross-exec:
    name: execute ${{ matrix.target }} suite under qemu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            qemu: qemu-aarch64
          - target: i686-unknown-linux-musl
            qemu: qemu-i386
          - target: powerpc64-unknown-linux-musl
            qemu: qemu-ppc64
          # The scalar-only configuration, on 64-bit RISC-V.  It needs the extra
          # link flags the build step sets below; `.cargo/config.toml` has the
          # full account, including why the getrandom weak symbol is forced.
          - target: riscv64gc-unknown-linux-musl
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cross-exec-${{ matrix.target }}

      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
          ${{ matrix.qemu }} --version

      # Mirrors stage 5 of ./verify.sh, which is the local entry point for the
      # same check. The test binaries are invoked directly rather than through
      # `cargo test --target`, so the emulator is used explicitly and a runner
      # misconfiguration cannot silently execute the target code natively.
      # `--features pure` because BLAKE3's build script compiles C kernels for
      # x86_64/aarch64 by default and needs a *target* C toolchain to do it; the
      # Rust backends need nothing. BLAKE3's backend is irrelevant to what this
      # job tests (the crate's own SIMD code), and the wire format is identical
      # either way -- the KATs and the equivalence corpus pin it.
      # ppc64 and riscv64 need no cross toolchain: rust-std ships the self-contained
      # crt objects and musl's libc, so rust-lld can link them.  Each needs an alias
      # for `libgcc_s.a` (the unwinder ships as `libunwind.a`) and a non-PIE
      # relocation model (the shipped `libc.a` is non-PIC).  riscv64 additionally
      # needs `-C link-self-contained=yes` -- without it the link still succeeds but
      # produces an entry point of 0, a segfault before the first syscall -- and
      # `--undefined=getrandom`, because that symbol is declared weak and would
      # otherwise stay unresolved, which on riscv64 turns the getrandom call into a
      # branch to itself.  `.cargo/config.toml` has the full account.
      - name: extra setup for the self-contained-musl targets
        if: matrix.target == 'powerpc64-unknown-linux-musl' || matrix.target == 'riscv64gc-unknown-linux-musl'
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          alias_dir="$HOME/.local/share/xsiv-cross"
          mkdir -p "$alias_dir"
          case "${{ matrix.target }}" in
            powerpc64-unknown-linux-musl)
              ln -sf "$sysroot/lib/rustlib/powerpc64-unknown-linux-musl/lib/self-contained/libunwind.a" "$alias_dir/libgcc_s.a"
              {
                echo "CARGO_TARGET_POWERPC64_UNKNOWN_LINUX_MUSL_LINKER=$sysroot/lib/rustlib/$host/bin/rust-lld"
                echo "CARGO_TARGET_POWERPC64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker-flavor=ld.lld -C link-self-contained=yes -C relocation-model=static -L native=$alias_dir"
              } >> "$GITHUB_ENV"
              ;;
            riscv64gc-unknown-linux-musl)
              ln -sf "$sysroot/lib/rustlib/riscv64gc-unknown-linux-musl/lib/self-contained/libunwind.a" "$alias_dir/libgcc_s.a"
              {
                echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker-flavor=ld.lld -C link-self-contained=yes -C relocation-model=static -C link-arg=--undefined=getrandom -L native=$alias_dir -L native=$sysroot/lib/rustlib/riscv64gc-unknown-linux-musl/lib/self-contained"
              } >> "$GITHUB_ENV"
              ;;
          esac
      # The list of binaries this build produced is captured, not guessed: `deps/` also
      # holds artifacts from earlier feature configurations (`Swatinem/rust-cache` restores
      # `target/`), and running those executes stale code. Measured locally: three such
      # binaries failed with counts from an older revision of their own tests, which reads
      # as "the cross target is broken" and is not.
      # `--features ultra,pure`: `pure` because BLAKE3's build script compiles C kernels
      # for x86_64/aarch64 and needs a *target* C toolchain to do it, while this job exists
      # to run *this crate's* code; `ultra` because it is the configuration with the most
      # code in it and the parts of it that are architecture-sensitive -- the
      # `from_le_bytes`/`to_le_bytes` conversions on every ChaCha20 and BLAKE3 word, 64-bit
      # chunk counters and lengths on a 32-bit `usize` -- are only reachable there. Leaving
      # `ultra` out meant the only architecture-dependent code in the crate was the only
      # code never executed on another architecture.
      - name: build ${{ matrix.target }} test binaries
        run: |
          set -euo pipefail
          # Both files live in `$RUNNER_TEMP`, not in the checkout: they are byproducts of
          # this step, and writing them into the working tree once put a `build.log` and an
          # `executables.txt` (with this host's paths) into the repository, where a later
          # `git add -A` committed them. `$RUNNER_TEMP` also survives between the steps of
          # this job, which is what the execute step needs.
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          # Three details, all of which made this step fail on every target from the commit
          # that introduced the parse until this one -- while `verify.sh`'s copy of the same
          # code worked locally, which is why it took a failing CI run to find:
          #
          #   * `2>&1`, because cargo writes "*Executable*" to **stderr** (only the test
          #     binaries' own output goes to stdout), so `| tee build.log` captured an empty
          #     file. Locally the pipeline had the redirect already.
          #   * `CARGO_TERM_COLOR=never`, because the workflow sets `always` at the top
          #     level and cargo then colours those same lines even through a pipe.
          #   * the `sed` expression itself: this file carried `\\(` and `\\1`, which reach
          #     `sed` as an escaped backslash -- a *literal* backslash in the pattern, which
          #     the line never contains. `verify.sh` has the single-backslash form and works.
          #
          # The `grep -q` guards are what would have caught all three: a parse that matches
          # nothing is not the same as a build that produced nothing, and "count > 0" accepts
          # any non-empty parse, including a wrong one.
          CARGO_TERM_COLOR=never cargo test --target ${{ matrix.target }} --release \
            --no-run --features ultra,pure 2>&1 | tee "$work/build.log"
          sed -n 's/^ *Executable .*(\(.*\))$/\1/p' "$work/build.log" > "$work/executables.txt"
          count="$(grep -c . "$work/executables.txt" || true)"
          [ "$count" -gt 0 ] || { echo "cargo reported no executables" >&2; exit 1; }
          grep -q 'xchacha20_blake3_siv-' "$work/executables.txt" \
            || { echo "the parse did not find the library test binary -- check the sed" >&2; exit 1; }
          grep -q 'differential_reference-' "$work/executables.txt" \
            || { echo "the parse did not find the differential binary -- check the sed" >&2; exit 1; }
          echo "built $count test binaries"
          cat "$work/executables.txt"

      - name: execute under qemu
        run: |
          set -euo pipefail
          ran=0
          # Every test binary the build produced, not a hand-listed few. The list used to
          # name four (`xchacha20_blake3_siv-*`, `differential_reference-*`, `security-*`,
          # `threads-*`), which left `counter_range`, `decision`, `decision_scope`,
          # `locked`, `ultra` and `variable_latency` built but never executed on the cross
          # targets -- including `counter_range`, whose 32-bit assertions exist for the
          # i686 run, and `locked`, whose syscall numbers are per-architecture. The two
          # exclusions need something the emulator cannot provide: `timing-*` a real clock,
          # `ctgrind-*` valgrind on x86_64.
          #
          # `security-*` is executed here, with `--skip timing` kept as a belt: the
          # statistical timing screen lives in `tests/timing.rs` (its binary is `timing-*`,
          # already excluded above), so the flag is currently a no-op -- but it costs
          # nothing and keeps this step correct if a timing test moves back into
          # `security.rs`, which is where it used to live.
          while IFS= read -r bin; do
            case "$(basename "$bin")" in timing-*|ctgrind-*) continue ;; esac
            extra=()
            case "$(basename "$bin")" in security-*) extra=(--skip timing) ;; esac
            echo "--- $(basename "$bin") ---"
            ${{ matrix.qemu }} "$bin" --test-threads=1 ${extra[@]+"${extra[@]}"}
            ran=$((ran + 1))
          done < "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/executables.txt"
          if [ "$ran" -eq 0 ]; then
            echo "no ${{ matrix.target }} test binaries were executed (executables.txt was empty or all entries were excluded)" >&2
            exit 1
          fi
          echo "executed $ran ${{ matrix.target }} test binaries under qemu"

  differential:
    name: differential fixture vs reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: install the blake3 module
        run: python3 -m pip install --quiet blake3

      # The reference implementation self-checks against the published RFC 8439,
      # HChaCha20 and c2sp.org vectors before it emits anything, so a failure
      # here means the reference itself is wrong, not merely that it disagrees.
      - name: reference implementation self-checks
        run: python3 tools/ref_impl.py

      # Fails if the committed fixture no longer matches what the reference
      # produces, i.e. if someone edited a KAT by hand or changed the
      # construction without regenerating.
      - name: committed fixture is current
        run: python3 tools/gen_test_vectors.py --check

  stack-residue:
    name: stack residue (advisory, ultra)
    runs-on: ubuntu-latest
    # `continue-on-error` on purpose, and the reason is written here rather than
    # left implicit: what this measures is *layout dependent* -- the residue that
    # `ultra`'s `scrub_stack` erases lives in the `blake3` dependency's frames,
    # and which frames a compiler picks is not something a test can pin.  The
    # assertion it does make (the master key never appears in the call-chain
    # stack region) has held in every run so far, so this job is expected to
    # pass; it is advisory so that a toolchain change that moves the residue
    # *reports* instead of blocking, which is the honest disposition for a
    # measurement whose target is a compiler's choice.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Default build: the residue is expected here, and the tool reports it
      # rather than failing -- the assertion is on the master key, which does not
      # appear in any configuration.
      - name: default build
        run: tools/stack_residue.sh

      # `ultra`: `scrub_stack` overwrites the region, so this is the run that
      # shows the defence working.
      - name: ultra build
        run: tools/stack_residue.sh --ultra

  release:
    name: tag the commit and publish a release
    # Gate on every verification job: a release must not exist for a commit that
    # did not pass. `needs` also means a failure anywhere blocks this.
    #
    # `timing-instrument` is in the list because it is *blocking* (no
    # `continue-on-error`) and was previously omitted, so a commit whose timing
    # instrument had rotted could still cut a release -- contradicting this comment.
    # The two advisory jobs (`timing`, `stack-residue`) are `continue-on-error: true`
    # and are deliberately not gates.
    needs: [lint, test, msrv, cross, cross-exec, differential, timing-instrument]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the generated notes can be compared against the
          # previous release.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Each job gets a fresh runner, so the lint job's `cargo package` output is
      # not available here: this job must package the crate itself.
      - name: package the crate
        run: |
          set -euo pipefail
          cargo package
          ls -l target/package/*.crate

      # Every release has three configurations, and this step is what makes that a
      # claim rather than a hope. Features are compile-time, so "three versions" for a
      # library means three *supported configurations*, each built here, each tested by
      # a named leg of the `test` matrix, and each described in the artifact attached
      # below:
      #
      #   * `opt-out`   --release --no-default-features
      #   * `hardened`  --release                          (the default)
      #   * `ultra`     --release --features ultra
      #
      # Two things are checked. First, the three build *in this job*, from the same
      # commit the release is cut from: the matrix proved they pass their tests, this
      # proves they are buildable in the release environment too. Second, the `test`
      # matrix still names all three -- `needs: [test]` only means something while those
      # legs exist, and a matrix entry dropped in a refactor would otherwise take a
      # configuration out of the gate silently. The same idea as the source-shape tests
      # in `tests/`, applied to the workflow itself.
      - name: build the three configurations, and prove the matrix still names them
        run: |
          set -euo pipefail
          cargo build --release --no-default-features
          cargo build --release
          cargo build --release --features ultra
          # The `- ` prefix *and* the `$` anchor are both load-bearing, not cosmetic.
          # Without them the search string matches *this loop's own literals* on the
          # lines above (so the grep always succeeds and the guard can never fire --
          # measured: deleting a leg from the matrix still printed "matrix leg present"),
          # and without the anchor `- profile: release, no default features` also matches
          # the longer `- profile: release, no default features with rng` row. A matrix
          # row is exactly `- profile: ...`; anchoring both ends makes the check mean what
          # it says. (Same class as the other vacuous gates this repo has found: a check
          # that cannot fail reads as a pass.)
          for leg in 'profile: release, default features' \
                     'profile: release, no default features' \
                     'profile: release, ultra'; do
            if ! grep -q -- "- $leg\$" .github/workflows/ci.yml; then
              echo "::error::the test matrix no longer contains a '- $leg' entry, so this release would not be gated on that configuration"
              exit 1
            fi
            echo "matrix leg present: - $leg"
          done

      # One artifact per configuration, not one artifact for the default and prose about the
      # others. A `.crate` is feature-agnostic -- what a consumer gets depends on the features
      # *they* enable -- so the three configurations are only "shipped" if each has something a
      # user can take away and use, and if the release itself demonstrates what the three have
      # in common.
      #
      # Each bundle carries the compiled library for that configuration, a runnable binary
      # (`xsiv_stdin`), the input vector it was run on, and a manifest with the exact build
      # command, the resolved feature set, the file digests, and the known-answer output. The
      # last of those is also the cross-check
      # between configurations: **the same vector through all three must produce the same
      # ciphertext and tag byte for byte**, and the step fails if they differ. That is the release
      # proving the claim "identical bytes, different defences" rather than asserting it.
      - name: package one artifact per configuration
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=12 HEAD)"
          mkdir -p dist

          # A fixed vector, run through the crate's own audit CLI: one line of four
          # space-separated hex fields (`key_hex nonce_hex aad_hex msg_hex`, see the example's
          # header). The message crosses ChaCha20's 64-byte block so the ciphertext needs two
          # blocks, and the AAD is non-empty. (`-` would be the empty field, per that header.)
          cat > dist/vector.txt <<'VEC'
          000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f 000102030405060708090a0b0c0d0e0f1011121314151617 616164 4d657373616765206c6f6e676572207468616e206f6e6520436861436861323020626c6f636b2c20736f20746865206b657973747265616d20636f6e74696e7565732e
          VEC

          first_kat=""
          for cfg in opt-out hardened ultra; do
            case "$cfg" in
              opt-out)  flags="--no-default-features" ;;
              hardened) flags="" ;;
              ultra)    flags="--features ultra" ;;
            esac
            echo "=== bundling $cfg ($flags) ==="
            # `--lib` is required, not incidental. Building *only* the example does not
            # regenerate the root `target/release/libxchacha20_blake3_siv.rlib`: that
            # artifact is uplifted only when the lib target is built. Measured on this
            # workflow before the fix: after `cargo build --release --no-default-features
            # --example xsiv_stdin` the root rlib still had the feature set of the last
            # plain `cargo build` (the `ultra` one, three steps earlier), so all three
            # bundles shipped the same `ultra` library while their manifest claimed "the
            # compiled library for this configuration" -- and the three `.rlib` digests in
            # the per-bundle tables would have been identical. With `--lib` each iteration
            # rewrites the root rlib to the matching feature set: the three digests are
            # then distinct (verified by running this loop locally).
            cargo build --release $flags --lib --example xsiv_stdin
            bin="target/release/examples/xsiv_stdin"
            rlib="$(ls target/release/libxchacha20_blake3_siv*.rlib | head -1)"

            name="xsiv-${short}-${cfg}"
            mkdir -p "dist/$name"
            cp "$bin" "dist/$name/xsiv_stdin"
            cp "$rlib" "dist/$name/$(basename "$rlib")"
            # Ship the input the KAT is the answer for, so a consumer can re-derive it
            # instead of taking the bundled digest on faith.
            cp dist/vector.txt "dist/$name/vector.txt"

            # The known-answer output for this configuration, and the cross-configuration check.
            "$bin" < dist/vector.txt > "dist/$name/kat.txt"
            # A guard earned by a local dry run: with the vector in the wrong format the CLI
            # panicked and wrote *nothing*, and all three configurations "matched" — on the hash
            # of an empty file. Same bytes for the worst possible reason. So an empty or
            # unterminated output is a failure here, before any hash is compared.
            if [ ! -s "dist/$name/kat.txt" ]; then
              echo "::error::$cfg produced no known-answer output at all; the vector is probably malformed (see the example's header for the field format)"
              exit 1
            fi
            if ! grep -qE '^[0-9a-f]+ [0-9a-f]+$' "dist/$name/kat.txt"; then
              echo "::error::$cfg's known-answer output is not a '<ciphertext_hex> <tag_hex>' line:"
              cat "dist/$name/kat.txt" >&2
              exit 1
            fi
            kat="$(sha256sum < "dist/$name/kat.txt" | cut -d' ' -f1)"
            if [ -z "$first_kat" ]; then
              first_kat="$kat"
              echo "  kat sha256: $kat (reference for the other two)"
            elif [ "$kat" != "$first_kat" ]; then
              echo "::error::$cfg produced different ciphertext/tag for the same vector ($kat vs $first_kat): the wire format is NOT identical across configurations, and the release notes must not say it is"
              # Print all three outputs side by side. `diff <(cat dist/*/kat.txt)` looked
              # like a comparison but passed a single operand to `diff`, which printed
              # "missing operand" and exited 2 -- swallowed by `|| true`, so the one
              # failure path that matters showed nothing useful.
              echo "per-bundle known-answer output:" >&2
              for f in dist/*/kat.txt; do printf '%s: ' "$f" >&2; cat "$f" >&2; done
              exit 1
            else
              echo "  kat sha256: $kat (identical to the opt-out bundle)"
            fi

            {
              echo "# XChaCha20-BLAKE3-SIV -- $cfg bundle"
              echo
              echo "Commit: ${GITHUB_SHA} (${short})"
              echo "Configuration: **$cfg**"
              echo "Built with: \`cargo build --release ${flags}\` (rustc $(rustc --version | cut -d' ' -f2))"
              echo
              echo "## Contents"
              echo
              echo "| File | What it is |"
              echo "| --- | --- |"
              echo "| \`xsiv_stdin\` | the crate's audit CLI, built for this configuration |"
              echo "| \`libxchacha20_blake3_siv*.rlib\` | the compiled library for this configuration, **for inspection** — an \`rlib\` is not self-contained: linking it needs the same toolchain and the same dependency \`rlib\`s. The supported way to use this crate is the \`.crate\` attached to the release, with the features you want |"
              echo "| \`kat.txt\` | the known-answer output for \`vector.txt\` in this configuration |"
              echo "| \`vector.txt\` | the input \`kat.txt\` is the answer for — one line, four space-separated hex fields (\`key nonce aad msg\`), the format \`xsiv_stdin\` reads on stdin |"
              echo
              echo "## Digests"
              echo
              echo '```'
              (cd "dist/$name" && sha256sum xsiv_stdin *.rlib kat.txt vector.txt)
              echo '```'
              echo
              echo "## Known-answer output"
              echo
              echo "Same vector, same bytes as the other two configurations: \`sha256(kat.txt) = $kat\`."
              echo
              echo '```'
              cat "dist/$name/kat.txt"
              echo '```'
              echo
              echo "## Features resolved in this build"
              echo
              echo '```'
              cargo tree --edges normal $flags | head -20
              echo '```'
              echo
              echo "See \`CONFIGURATIONS.md\` (also attached) for what each configuration adds and"
              echo "what it costs."
            } > "dist/$name/README.md"

            tar -czf "dist/$name.tar.gz" -C dist "$name"
            echo "  wrote dist/$name.tar.gz ($(stat -c%s "dist/$name.tar.gz") bytes)"
          done
          ls -l dist/*.tar.gz

      - name: write the configuration manifest
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=12 HEAD)"
          cat > target/CONFIGURATIONS.md <<EOF
          # The three configurations of this release

          Built and tested from commit \`${short}\`. Features are compile-time, so all three come
          from the *same* \`.crate\` file; what differs is what the compiler includes.

          | Configuration | Cargo | What it adds |
          | --- | --- | --- |
          | \`opt-out\` | \`--no-default-features\` | Nothing: one accept/reject comparison. The fault-model boundary is the README's "What is not defended against" table. |
          | \`hardened\` (default) | \`--release\` | Two independently recomputed gates with separate branches, fail-closed, through \`subtle\`. |
          | \`ultra\` | \`--features ultra\` | Everything above plus the independent second implementation cross-checking the tag on both decrypt paths and on the allocating \`encrypt\` (the in-place \`encrypt_in_place_detached\` carries no cross-check — see README, "What the witness is"), two differently-written comparisons, and the \`locked\`/\`rng\`/\`dual-mac\` layers. |

          Each row is gated on a named leg of the \`test\` matrix at this commit
          (\`release, default features\`, \`release, no default features\`, \`release, ultra\`), plus the
          cross-target and qemu executions, the differential fixture against the independent
          reference, and the formal proofs in \`formal.yml\` (which are not a release gate).

          The wire format is **identical across the three**: the KATs, the differential fixture and
          the accelerated-path corpus pin the same bytes in every configuration, and this release
          carries a per-configuration bundle (\`xsiv-<commit>-<configuration>.tar.gz\`) with the
          compiled library, a runnable binary and that configuration's known-answer output, whose
          digest is the same in all three. What changes is
          the fault model and the cost; per-configuration performance against RustCrypto's
          \`chacha20poly1305\` is in \`performance.md\`.
          EOF
          cat target/CONFIGURATIONS.md

      # The tag is the commit, as requested: an immutable, unambiguous pointer
      # at exactly the tree that passed CI. A *moving* tag such as `latest`
      # would silently change what it points at, which is the wrong property for
      # a release of a cryptographic library.
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short="$(git rev-parse --short=12 HEAD)"
          tag="sha-${short}"

          # Expand the glob ourselves and refuse to publish an empty release.
          # Defensive rather than a fix for a known failure: an unexpanded glob
          # is silent, and an unattached artifact is easy to miss at the time.
          shopt -s nullglob
          crates=(target/package/*.crate)
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error::no .crate artifact found to attach"
            exit 1
          fi
          # The configuration manifest is a *required* artifact: it is the statement that
          # this release is the three-configuration release, and a release that quietly
          # shipped without it would be the failure mode this whole step exists to stop.
          manifest=target/CONFIGURATIONS.md
          if [ ! -s "$manifest" ]; then
            echo "::error::$manifest is missing or empty; the configuration step did not run"
            exit 1
          fi
          # The per-configuration bundles are *required* artifacts for the same reason the
          # manifest is: a release that silently shipped only the default build would be the
          # failure this whole step exists to prevent.
          shopt -s nullglob
          bundles=(dist/*.tar.gz)
          if [ "${#bundles[@]}" -ne 3 ]; then
            echo "::error::expected three configuration bundles in dist/, found ${#bundles[@]}: ${bundles[*]}"
            exit 1
          fi
          echo "artifacts to attach: ${crates[*]} ${manifest} ${bundles[*]}"

          # Idempotent in the strong sense: if the release already exists, attach
          # the artifact to it rather than reporting "nothing to do". This path is
          # not known to have been hit, but skipping the attach is the kind of
          # thing that would go unnoticed for a long time.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; uploading artifact"
            gh release upload "$tag" "${crates[@]}" "$manifest" "${bundles[@]}" --clobber
            exit 0
          fi

          cat > notes.md <<EOF
          Snapshot of \`main\` at commit [\`${short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          **Three configurations, three artifacts.** Features are compile-time, so the
          \`.crate\` is one source tree whose behaviour depends on the features a consumer
          enables. Each configuration therefore also ships as its own bundle —
          \`xsiv-${short}-opt-out.tar.gz\`, \`-hardened.tar.gz\`, \`-ultra.tar.gz\` — containing the
          compiled library, a runnable binary, the known-answer output and the resolved
          feature set for that configuration, with digests in each bundle's \`README.md\`.

          The three known-answer outputs are **byte-identical** (\`sha256\` of the tag and
          ciphertext for the same vector is the same in all three), which this job verifies
          before publishing rather than asserting here. Attached [\`CONFIGURATIONS.md\`](./CONFIGURATIONS.md)
          describes what each adds and what it costs:

          | | Cargo | Adds |
          | --- | --- | --- |
          | \`opt-out\` | \`--no-default-features\` | nothing (one comparison) |
          | \`hardened\` (default) | \`--release\` | two gates, independent recomputation, fail-closed |
          | \`ultra\` | \`--features ultra\` | + witness cross-check and the \`locked\`/\`rng\`/\`dual-mac\` layers |

          Each configuration is gated on its own leg of the CI test matrix at this commit.

          Gated by CI on this commit: formatting and lints clean, the full test
          suite green in release and debug, three cross-targets type-checked, the
          aarch64 (NEON), i686 (32-bit), powerpc64 (big-endian) and riscv64
          (scalar-only) suites executed under qemu, and the
          differential fixture
          re-checked against the independent reference implementation.

          The formal proofs in \`.github/workflows/formal.yml\` run separately and
          are not a gate for this release.

          > **Wire format.** This construction is bespoke and not byte-compatible
          > with anything else: a two-level keyed-BLAKE3 65-byte tag over the
          > XChaCha20 nonce extension. The format changed twice on the way here
          > (v0.1 used Poly1305 with a 32-byte tag; v0.3 made the tag two-level) and
          > revision \`v0.3\` is now frozen: it will not change without an explicit
          > revision bump, not silently. The crate itself is pre-1.0, so its Rust API
          > may still move. See README.md for the construction and its security level.
          EOF

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "XChaCha20-BLAKE3-SIV ${short}" \
            --notes-file notes.md \
            --latest \
            "${crates[@]}" "$manifest" "${bundles[@]}"
