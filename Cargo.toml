[package]
name = "xchacha20-blake3-siv"
version = "0.1.0"
edition = "2021"
authors = ["Security Team"]
description = "XChaCha20-BLAKE3-SIV: misuse-resistant, key- and context-committing AEAD with a 24-byte nonce and a 520-bit tag"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sourcetf/XChaCha20-BLAKE3-SIV"
readme = "README.md"
rust-version = "1.85"
keywords = ["cryptography", "aead", "xchacha20", "blake3", "siv"]
categories = ["cryptography", "no-std"]
[dependencies]
# subtle provides constant-time comparison
subtle = { version = "2.6.1", default-features = false }

# Optional OS randomness for `generate_key` / `generate_nonce`.  Off by default
# so `no_std` users and users who supply their own entropy source pay nothing
# (not even the dependency).  See the `random` module.
getrandom = { version = "0.3", optional = true, default-features = false }

# BLAKE3 supplies the context-commitment half of the tag (see
# `blake3_keyed_multi` in lib.rs).  `default-features = false` keeps it `no_std`.
#
# **No `pure` here, deliberately: it costs 24-32%.** BLAKE3's `pure` feature
# selects its Rust-intrinsics backends; without it, BLAKE3 uses its C/assembly
# SIMD kernels where the target has them. Measured with `benches/bench.rs` on
# x86_64 (Ryzen 9 7945HX, release+LTO): 966 -> 766 MB/s at 4 KiB, 2540 -> 2053
# MB/s at 1 MiB, and the whole crate goes from ~30% behind RustCrypto's
# XChaCha20-Poly1305 at 4-64 KiB to parity or ahead.
#
# Portability is not lost, because BLAKE3's build script *falls back* to the Rust
# backends when no compiler is available for the target (`support == NoCompiler`).
# Verified: a build with `CC=/nonexistent` produces identical output, as does
# `cargo check --target thumbv7em-none-eabihf` (bare metal).
#
# Two cases still need `--features pure`, and both are in the scripts/CI:
#
#   * cross-compiling to a target BLAKE3 has C kernels for (x86_64, aarch64)
#     *without* a cross C toolchain -- the build script fails rather than falling
#     back there, because a compiler for the *host* is found and the target's
#     kernels are then attempted. That is the `aarch64-unknown-linux-musl` /
#     `i686-unknown-linux-musl` builds used to execute the crate's own SIMD code
#     under qemu, where BLAKE3's backend makes no difference to what is tested;
#   * Miri, which cannot execute C or the CPU-feature detection.
#
# Either way the wire format is identical -- the KATs, the differential fixture
# and `test_all_accelerated_paths_agree_on_a_boundary_corpus` pin the bytes, and
# they run against both backends.
blake3 = { version = "1.8", default-features = false, features = ["zeroize"] }

# `zeroize` exists so BLAKE3's *internal* state can be wiped. The MAC key lives
# inside `blake3::Hasher` (`key: CVWords`, plus the chunk state and CV stack), and
# that memory is unreachable from this crate — enabling BLAKE3's `zeroize`
# feature is the only way to clear it. It is not automatic on drop, so
# `blake3_keyed_multi` calls `.zeroize()` explicitly.
#
# Required unconditionally, NOT optional and NOT behind a feature: `blake3`
# always needs zeroizing and the code uses the trait unconditionally, so gating
# it produced a crate that failed to build with `--no-default-features` — which
# is exactly how a `no_std` user consumes it. Nothing needs it off.
#
# This crate still implements its own volatile wipes (`zeroize_array` /
# `zeroize_slice`) for the secrets it owns, and those do not go through this
# dependency.
zeroize = { version = "1", default-features = false }

[dev-dependencies]
criterion = "0.5"
# For the digest-based large-vector fixture: the test hashes `ciphertext || tag`
# with plain BLAKE3 and compares it to what the reference implementation produced.
blake3 = { version = "1.8", default-features = false, features = ["zeroize"] }
# The head-to-head benchmark in `benches/compare.rs`: RustCrypto's
# XChaCha20-Poly1305 is the natural reference point (same 24-byte nonce), and
# `aead` supplies the trait both sides are driven through.
chacha20poly1305 = "0.10"
aead = { version = "0.5", features = ["alloc"] }
# Property-based tests. The security tests in `tests/security.rs` are the main
# reason for this: "no single-bit tamper is ever accepted" is a statement over
# every possible input, which is exactly what a property test is for.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Integration tests cannot see the crate's own dependencies, and `tests/ctgrind.rs`
# compares operands through `subtle::ConstantTimeEq` directly to check the
# primitive the tag comparison rests on.
subtle = { version = "2.6.1", default-features = false }
# NOTE: no `rand` dependency.  proptest brings its own generator, and the fuzz
# loop in `tests/security.rs` uses a small deterministic PRNG defined there, so a
# failure is reproducible from a seed without a third-party RNG in the tree.

[features]
# Opt-in OS randomness for `generate_key` / `generate_nonce`.  Off by default:
# `no_std` builds and users who already have an entropy source pay nothing.
rng = ["dep:getrandom"]

# Force BLAKE3's portable Rust backends. Off by default: the native ones are
# faster, and BLAKE3 falls back to the Rust ones automatically when the target
# has no compiler. Turn this on when cross-compiling to a target with C kernels
# and no cross C toolchain, or when running under Miri.
pure = ["blake3/pure"]

[[bench]]
name = "bench"
harness = false

# Head-to-head against RustCrypto's XChaCha20-Poly1305 and ChaCha20-Poly1305.
[[bench]]
name = "compare"
harness = false

[lints.rust]
# `kani` is the cfg Kani injects when building verification harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[workspace]
resolver = "2"
# `cargo-fuzz` builds its target against the nightly sanitizer runtime, with its
# own manifest; it must not be part of this workspace or the two disagree about
# who owns the profile.
exclude = ["fuzz"]