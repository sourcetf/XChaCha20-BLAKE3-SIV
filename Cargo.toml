[package]
name = "xchacha20-blake3-siv"
version = "0.1.0"
edition = "2021"
authors = ["Security Team"]
description = "XChaCha20-BLAKE3-SIV: misuse-resistant, key- and context-committing AEAD with a 24-byte nonce and a 520-bit tag"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sourcetf/XChaCha20-BLAKE3-SIV"
readme = "README.md"
rust-version = "1.85"
keywords = ["cryptography", "aead", "xchacha20", "blake3", "siv"]
categories = ["cryptography", "no-std"]
# Source-only distribution: BLAKE3 is the maintained fork under `blake3/`, reached
# by a direct path dependency. This package does not resolve BLAKE3 from crates.io,
# and it is not published as a `.crate`; consumers use the repository. The flag is
# deliberate: `cargo publish` would otherwise have to strip the path dependency and
# silently substitute the unpatched registry crate.
publish = false

[dependencies]
# subtle provides constant-time comparison
subtle = { version = "2.6.1", default-features = false }

# Optional OS randomness for `generate_key` / `generate_nonce`.  Off by default
# so `no_std` users and users who supply their own entropy source pay nothing
# (not even the dependency).  See the `random` module.
getrandom = { version = "0.4", optional = true, default-features = false }

# BLAKE3 supplies the context-commitment half of the tag (see
# `blake3_keyed_multi` in lib.rs).  `default-features = false` keeps it `no_std`.
#
# **No `pure` here, deliberately: it costs about 19-21% of throughput at the
# measured points.** BLAKE3's `pure` feature selects its Rust-intrinsics backends;
# without it, BLAKE3 uses its C/assembly SIMD kernels where the target has them.
# Measured on x86_64 (Ryzen 9 7945HX, release+LTO) with `examples/bench_aead.rs`,
# whose size sweep includes the 1 MiB point: 966 -> 766 MiB/s at 4 KiB, 2540 -> 2053
# MiB/s at 1 MiB (native 24-26% faster in the other direction). The head-to-head
# in `benches/compare.rs`, re-measured after the vendored fork's `hash_many` tail
# fix, puts the hardened crate within ~10-25% of RustCrypto's
# XChaCha20-Poly1305 at 4-5 KiB and at parity or ahead from 16 KiB up
# (`performance.md` has the current table).
#
# Portability is not lost, because BLAKE3's build script *falls back* to the Rust
# backends when no compiler is available for the target (`support == NoCompiler`).
# Checked by hand, not by a committed entry point -- no script in this repository
# runs either command. An audit re-ran `CC=/nonexistent` (builds, identical wire
# output) and `cargo check --no-default-features --target thumbv7em-none-eabihf`
# (passes; the way a `no_std` caller consumes the crate). The default-features
# form of that `cargo check`, which this comment used to name, has no runner
# outside the author's machine.
#
# Two cases still need `--features pure`, and both are in the scripts/CI:
#
#   * cross-compiling to aarch64 *without* a cross C toolchain -- blake3 1.8.7's
#     build script builds the NEON C kernels unconditionally on little-endian
#     aarch64 when `pure` is off (there is no compiler probe on that path to fall
#     back through), so with `aarch64-linux-musl-gcc` missing the build fails with
#     `failed to find tool "aarch64-linux-musl-gcc"` (exit 101) rather than
#     falling back to the Rust backends. That is the `aarch64-unknown-linux-musl`
#     build used to execute the crate's own SIMD code under qemu, where BLAKE3's
#     backend makes no difference to what is tested. (An audit checked the
#     `i686-unknown-linux-musl` case this comment used to name: with no i686/musl C
#     compiler installed, BLAKE3's build script probes and *does* fall back to its
#     Rust backends and the plain build succeeds -- the x86_64 branch probes the
#     same way and falls back too, so only aarch64 is a hard failure -- and the
#     `features pure` the scripts pass for i686 is belt-and-braces rather than
#     necessary. And nothing on i686 runs *this crate's* SIMD -- its kernels are
#     gated on x86_64/aarch64 -- so the qemu run there exercises the 32-bit scalar
#     paths, which is what it is for.)
#   * Miri, which cannot execute C -- the `pure` flag below is the one the scripts
#     pass so that the run does not depend on Miri's CPU-feature detection reporting
#     nothing (measured: on x86_64 the runs pass with and without it, because the
#     detection reports no features under Miri either way).
#
# Either way the wire format is identical -- the KATs, the differential fixture
# and `test_all_accelerated_paths_agree_on_a_boundary_corpus` pin the bytes, and
# they run against both backends.
#
# **`blake3::platform` is hazmat; do not call it directly.** The maintained fork
# under `blake3/` fixes the unsound `hash_many` tails, the multi-block `xof_many`
# ABI, and the short-output `xof_many` write (a safe call with `out.len()` in
# 1..=63 wrote a whole 64-byte block in release, up to 63 bytes past the slice).
# This crate still does not call it: it only uses `OutputReader::fill`, which
# passes `full_blocks * 64` and handles the remainder through `fill_one_block`
# (confirmed with canaried slices of every length 0..=130).
blake3 = { version = "1.8.7", path = "blake3", default-features = false, features = ["zeroize"] }

# `zeroize` exists so BLAKE3's *internal* state can be wiped. The MAC key lives
# inside `blake3::Hasher` (`key: CVWords`, plus the chunk state and CV stack), and
# that memory is unreachable from this crate — enabling BLAKE3's `zeroize`
# feature is the only way to clear it. It is not automatic on drop, so
# `blake3_keyed_multi` calls `.zeroize()` explicitly.
#
# Required unconditionally, NOT optional and NOT behind a feature: `blake3`
# always needs zeroizing and the code uses the trait unconditionally, so gating
# it produced a crate that failed to build with `--no-default-features` — which
# is exactly how a `no_std` user consumes it. Nothing needs it off.
#
# This crate still implements its own volatile wipes (`zeroize_array` /
# `zeroize_slice`) for the secrets it owns, and those do not go through this
# dependency.
# 1.5 is the floor: `Key` implements `ZeroizeOnDrop`, which was introduced in
# zeroize 1.5. The manifest used to say `"1"`, which claimed compatibility with
# versions whose API this crate does not compile against.
zeroize = { version = "1.5", default-features = false }

[dev-dependencies]
criterion = "0.5"
# For the digest-based large-vector fixture: the test hashes `ciphertext || tag`
# with the same vendored BLAKE3 fork the library uses.
blake3 = { version = "1.8.7", path = "blake3", default-features = false, features = ["zeroize"] }
# The head-to-head benchmark in `benches/compare.rs`: RustCrypto's
# XChaCha20-Poly1305 is the natural reference point (same 24-byte nonce), and
# `aead` supplies the trait both sides are driven through. Disable their default
# `rand_core`/`getrandom` features: these are test-only comparisons using fixed
# keys, and the defaults pull a second legacy RNG stack into every test build.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aead = { version = "0.5", default-features = false, features = ["alloc"] }
# Property-based tests. The security tests in `tests/security.rs` are the main
# reason for this: "no single-bit tamper is ever accepted" is a statement over
# every possible input, which is exactly what a property test is for.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Integration tests cannot see the crate's own dependencies, and `tests/ctgrind.rs`
# compares operands through `subtle::ConstantTimeEq` directly to check the
# primitive the tag comparison rests on.
subtle = { version = "2.6.1", default-features = false }
# The vendored-BLAKE3 guard-page regression test (`hash_many` must not read past a
# 64-byte block into a PROT_NONE page) needs `mprotect`/`mmap` on Linux.
libc = "0.2"
# NOTE: no `rand` dependency.  proptest brings its own generator, and the fuzz
# loop in `tests/security.rs` uses a small deterministic PRNG defined there, so a
# failure is reproducible from a seed without a third-party RNG in the tree.

[features]
# Fault-injection hardening of the accept/reject decision (see the `hardened`
# section in the crate documentation, and "What is not defended against" in
# README.md). It makes the decision two comparisons over the same values, the second
# independently *shaped*, each with its own branch, so a single skipped instruction
# reaches the other gate instead of accepting a forgery.
#
# **On by default.** The property it protects is the one a forgery turns on, and it
# costs nothing on large messages, so an opt-in that most callers never enable would
# mean most callers are unprotected while the README claims hardening. A caller who
# has measured the small-message cost can have the single-gate build back with
# `default-features = false` (or `--no-default-features`).
#
# Measured cost of the default configuration against `--no-default-features`,
# AMD Ryzen 9 7945HX, re-measured for `v0.3`. The added work is three more 65-byte
# constant-time comparisons on **decrypt** — four in the default build, against the
# opt-out build's single pass — plus the eight-byte fold, so it is a fixed
# per-message cost: +25% at 64 B, +24% at 256 B, +23% at 1 KiB, +11% at 4 KiB, and
# within the noise floor from 16 KiB up. Encryption pays nothing for it, so a
# round-trip figure shows a smaller, noisier fraction of the same cost.
# `performance.md` is the source.
#
# This is not a claim of fault-injection resistance. It defends against a single
# fault on the decision only; two faults, a targeted fault in the tag computation
# itself, key recovery by differential fault analysis, and availability attacks are
# all outside what it can do. Nothing here has been validated on a real
# fault-injection bench.
default = ["hardened"]
hardened = []
# Everything at once: `hardened` plus the opt-in stack below. See the crate docs'
# "ultra" section for what each adds, what it costs (every figure measured), and --
# importantly -- what still cannot be defended against.
#
# `ultra` implies `rng`, so it needs an OS entropy source and does NOT build on
# bare-metal `no_std` targets (`--features ultra --target thumbv7em-none-eabihf`
# fails inside `getrandom`); a `no_std` caller should use the list
# `--features hardened,dual-mac` instead. That is `ultra` minus the witness, minus
# `rng`, and minus `locked` (functional only on Linux x86_64/aarch64; its stubs fail
# closed elsewhere). The `witness` module is gated on the `ultra` feature *name*, not
# on the features it implies, and there is no `witness` feature, so a target where
# `ultra` cannot build cannot turn that layer on at all.
#
# `pure` is deliberately *not* here: it forces BLAKE3's portable Rust backends, which
# costs about 19-21% of throughput at the measured points (see the `pure` comment
# below) and buys no security -- the C/assembly kernels are constant-time by
# construction and covered by the same differential tests.
# `ultra` is about defences, not about giving up speed for nothing.
ultra = ["hardened", "rng", "dual-mac", "locked"]
# A second derivation through the shared `derive_tag` path on the verify path (it catches
# a post-derivation rewrite of the stored value, not a fault inside the derivation). Defends
# against a fault that pins the computed tag to a constant or to the received tag (both gates
# compare the same two values, so they fail *together* without this). Measured +21..40% on
# decryption, +6..25% on a round trip.
# Implies `hardened`: the second derivation only exists to make the *second gate* differ,
# so without the gate there is nothing for it to strengthen -- measured with
# `cargo check --no-default-features --features dual-mac`, which built a second tag
# derivation, compared it against nothing, and warned that the comparison was dead code.
dual-mac = ["hardened"]
# `mlock` + `MADV_DONTDUMP` for keys: reaches past swap and core dumps, which a
# volatile-store wipe cannot. Measured ~7 us per range, so it belongs on long-lived
# keys, not per message.
locked = []

# Opt-in OS randomness for `generate_key` / `generate_nonce`.  Off by default:
# `no_std` builds and users who already have an entropy source pay nothing.
#
# `getrandom` needs a backend (`std` or an OS RNG), so this feature does not build
# on bare-metal `no_std` targets -- and `ultra` implies it, see above.
rng = ["dep:getrandom"]

# Force BLAKE3's portable Rust backends. Off by default: the native ones are
# faster, and BLAKE3 falls back to the Rust ones automatically when the target
# has no compiler -- except on little-endian aarch64, where its NEON kernels are
# attempted unconditionally (see the note on the `blake3` dependency above).
# Turn this on when cross-compiling to such a target without a cross C toolchain,
# or when running under Miri.
pure = ["blake3/pure"]

[[bench]]
name = "bench"
harness = false

# Head-to-head against RustCrypto's XChaCha20-Poly1305 and ChaCha20-Poly1305.
[[bench]]
name = "compare"
harness = false

[lints.rust]
# `kani` is the cfg Kani injects when building verification harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
# Not enabled: `unsafe_op_in_unsafe_fn` fires inside the SIMD kernels, whose bodies
# call other `unsafe fn`s (the transpose helpers) and intrinsics without inner
# `unsafe {}` blocks. Wrapping them is mechanical and behaviour-preserving -- the
# SIMD-vs-scalar tests would confirm it -- but it is a change to security-critical
# code, so it is a separate piece of work rather than a footnote to this one.

[lints.clippy]
# Every `unsafe` block carries a `// SAFETY:` comment saying why it is sound. Five
# were missing one when this was enabled -- three in `zeroize_slice`, two in tests --
# which is exactly the drift this gate exists to stop.
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[workspace]
# Resolver 3 is the MSRV-aware one: it makes cargo prefer dependency versions whose
# `rust-version` is compatible with this crate's, instead of the newest version available.
# That is what stops a routine `cargo update` — and Dependabot's, which runs the same
# resolution — from proposing a bump this crate cannot build on its declared MSRV.
# Measured before changing it: `cargo update -p proptest` under resolver 2 moved `proptest`
# to 1.12.0, which requires rustc 1.88, dragging in its new `borsh`/`bytes` tree — exactly
# what the Dependabot group PR proposed and what the CI MSRV job rejected. The same command
# under resolver 3 leaves `proptest` at 1.11.0. It needs Cargo 1.84+, which the declared
# MSRV (1.85) satisfies. The MSRV job remains the enforcement; this only stops the
# incompatible bump from being proposed in the first place.
resolver = "3"
# `cargo-fuzz` builds its target against the nightly sanitizer runtime, with its
# own manifest; it must not be part of this workspace or the two disagree about
# who owns the profile. `blake3` is a direct path dependency on the maintained fork;
# keeping it out of this workspace lets its own manifest/toolchain and guard-page
# example run with `--manifest-path blake3/Cargo.toml`.
exclude = ["fuzz", "blake3"]