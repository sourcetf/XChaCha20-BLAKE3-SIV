# Cross-compilation configuration.
#
# `aarch64-unknown-linux-musl` is the target used to *execute* the aarch64 code
# path (via qemu-user), not just to type-check it.  It is chosen over
# `aarch64-unknown-linux-gnu` deliberately:
#
#   * musl ships a self-contained `libc.a` and crt objects in the Rust
#     toolchain's `lib/rustlib/aarch64-unknown-linux-musl/lib/self-contained/`,
#     so no cross C toolchain (aarch64-linux-gnu-gcc) is needed to link.
#   * `rust-lld` ships with the toolchain and handles the link, so the whole
#     cross build works with nothing installed beyond `rustup target add`.
#
# The `-gnu` target, by contrast, needs a cross linker and sysroot that this
# project does not depend on; `cargo check --target aarch64-unknown-linux-gnu`
# still works for type-checking because it never links.
#
# Run the aarch64 test suite with `./verify.sh --cross-exec` (the older spelling,
# `--aarch64-exec`, is an alias), or `./verify.sh --deep` for every switch -- which is
# the same set as `--all`.

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# The scalar-only fallback path.  On riscv64 no SIMD backend is compiled at all
# (`x86_simd`/`aarch64_simd` are target-gated out), so this target exercises the
# scalar `chacha20_block` and the scalar block loop in `chacha20_apply` — the
# correctness reference every other backend is held to.  It also has no
# `has_avx2()`-style runtime detection, so the dispatch is compile-time only.
#
# Linking works, with four details — an earlier revision of this comment said it
# did not, and that was wrong (an audit linked it and ran the suite):
#
#   * an alias `libgcc_s.a` -> the shipped `libunwind.a`, the same trick the
#     ppc64 path uses (rustc asks for the unwinder under the other name);
#   * `-C link-self-contained=yes`, which is what actually pulls the shipped crt
#     objects and libc in.  (The old comment dismissed it; the `-L` below is
#     necessary but *not* sufficient: without this flag the link still succeeds
#     and produces a binary whose entry point is 0, which segfaults before its
#     first syscall.  Measured both ways.)
#   * `-L native=<sysroot>/lib/rustlib/riscv64gc-unknown-linux-musl/lib/self-contained/`,
#     which is what resolves `-lc` — the failure in the old comment was the
#     unwinder, not libc;
#   * `-C relocation-model=static`: the shipped `libc.a` is non-PIC, and a
#     static-PIE link starts and then segfaults under qemu-user (measured both
#     ways; the non-PIE binary runs).
#
# With those, all fourteen test binaries link, and twelve of them run under
# `qemu-riscv64` (plus `timing`, 3/3 in 383 s here).  `ctgrind` is the one
# exclusion, for the same reason it is excluded on every cross target: it shells
# out to valgrind, which cannot run under qemu.  The executed set includes
# `tests/ultra.rs` (8/8, the one that used to hang) and `tests/locked.rs`
# (10/10, skipping the locking cases as unsupported on this architecture).  One
# more flag is required because of a weak-symbol interaction, and it is the reason
# the earlier revision of this comment reported a hang instead:
#
#   * `-C link-arg=--undefined=getrandom`.  The `libc` crate declares musl's
#     `getrandom` **weak**, and a weak undefined reference does not make the
#     linker extract the archive member that defines it — so the symbol stays
#     undefined in the self-contained link.  On riscv64, LLD materialises the
#     *address* of an undefined weak symbol as the current program counter, and
#     the `getrandom` crate passes that address as a function pointer: the call
#     jumps to itself.  Measured: the executed instruction stream is a single
#     `auipc ra, 0; jalr ra` pair (15.3M executions of one guest PC), which is
#     what `tests/ultra.rs::every_layer_answers_correctly_in_the_ultra_build`
#     hangs in after it asks for OS entropy.  Forcing the member in fixes it; no
#     other target is affected (aarch64's binary defines `getrandom` — something
#     in that link already references it strongly — so only riscv64 showed this).
#
# The scalar path is not a separate implementation of the cipher — it is what every
# other target's tests compare against (`scalar_keystream` in the test module) — but
# being the reference is exactly why executing it is worth having: stage 5 of
# `verify.sh` (`--cross-exec`) and the `cross-exec` CI job run this recipe.
[target.riscv64gc-unknown-linux-musl]
linker = "rust-lld"
